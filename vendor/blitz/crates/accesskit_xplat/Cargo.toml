# Generated by vendor/blitz/normalize.py from the patched upstream manifest.
[package]
name = "accesskit_xplat"
version = "0.2.1"
edition = "2024"
rust-version = "1.91.0"
license = "Apache-2.0"
description = "AccessKit UI accessibility infrastructure: cross-platform adapter"
repository = "https://github.com/dioxuslabs/blitz"
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
name = "accesskit_xplat"
path = "src/lib.rs"

[features]
accesskit_android = ["dep:accesskit_android"]
accesskit_unix = ["dep:accesskit_unix"]
async-io = ["accesskit_unix/async-io"]
default = ["accesskit_unix", "async-io"]
tokio = ["accesskit_unix/tokio"]

[dependencies]
accesskit = { version = "^0.25" }
raw-window-handle = { version = "^0.6.2", features = ["std"] }

[target."cfg(any(target_os = \"linux\", target_os = \"dragonfly\", target_os = \"freebsd\", target_os = \"openbsd\", target_os = \"netbsd\"))".dependencies]
accesskit_unix = { version = "^0.24.0", default-features = false, optional = true }

[target."cfg(target_os = \"android\")".dependencies]
accesskit_android = { version = "^0.9.0", features = ["embedded-dex"], optional = true }
android-activity = { version = "^0.6.0" }

[target."cfg(target_os = \"macos\")".dependencies]
accesskit_macos = { version = "^0.27.0" }

[target."cfg(target_os = \"windows\")".dependencies]
accesskit_windows = { version = "^0.35.0" }

[lints.rust]
unexpected_cfgs = "allow"
