# Generated by vendor/blitz/normalize.py from the patched upstream manifest.
[package]
name = "anyrender_skia"
version = "0.12.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Skia backend for anyrender"
repository = "https://github.com/dioxuslabs/anyrender"
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
name = "anyrender_skia"
path = "src/lib.rs"

[features]
log_frame_times = ["debug_timer/enable", "pixels_window_renderer?/log_frame_times", "softbuffer_window_renderer?/log_frame_times"]
pixels_window_renderer = ["dep:pixels_window_renderer"]
softbuffer_window_renderer = ["dep:softbuffer_window_renderer"]
vulkan = ["skia-safe/vulkan"]

[dependencies]
anyrender = { path = "../anyrender", version = "^0.14.0" }
debug_timer = { version = "^0.1.1" }
hashbrown = { version = "^0.17.0" }
kurbo = { version = "^0.13.1" }
oaty = { version = "^0.2" }
peniko = { version = "^0.6" }
pixels_window_renderer = { path = "../pixels_window_renderer", version = "^0.9.0", optional = true }
raw-window-handle = { version = "^0.6.0" }
skia-safe = { version = "^0.156.0" }
skrifa = { version = "^0.44", default-features = false, features = ["std"] }
softbuffer_window_renderer = { path = "../softbuffer_window_renderer", version = "^0.9.0", optional = true }
tracing = { version = "^0.1", default-features = false }

[target."cfg(any(target_os = \"macos\", target_os = \"ios\"))".dependencies]
objc2 = { version = "^0.6.3", default-features = false }
objc2-core-foundation = { version = "^0.3.2", default-features = false }
objc2-core-graphics = { version = "^0.3.2", default-features = false, features = ["std", "CGColorSpace"] }
objc2-metal = { version = "^0.3.2", default-features = false, features = ["MTLCommandBuffer", "MTLCommandQueue", "MTLDrawable", "MTLPixelFormat"] }
objc2-quartz-core = { version = "^0.3.2", default-features = false, features = ["objc2-core-foundation", "objc2-core-graphics", "objc2-metal", "CAMetalLayer"] }
skia-safe = { version = "^0.156.0", features = ["ganesh", "metal"] }

[target."cfg(not(any(target_os = \"macos\", target_os = \"ios\")))".dependencies]
ash = { version = "^0.38.0" }
ash-window = { version = "^0.13.0" }
gl = { version = "^0.14.0" }
glutin = { version = "^0.32.3", features = ["default", "wgl", "egl"] }
skia-safe = { version = "^0.156.0", features = ["gl"] }

[target."cfg(target_os = \"ios\")".dependencies]
objc2-ui-kit = { version = "^0.3.2", default-features = false, features = ["objc2-quartz-core", "UIView", "UIResponder"] }

[target."cfg(target_os = \"macos\")".dependencies]
objc2-app-kit = { version = "^0.3.2", default-features = false, features = ["objc2-quartz-core", "NSView", "NSResponder"] }

[target."cfg(windows)".dependencies]
skia-safe = { version = "^0.156.0", features = ["d3d"] }
windows = { version = "^0.62", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }

[lints.rust]
unexpected_cfgs = "allow"
