# Generated by vendor/blitz/normalize.py from the patched upstream manifest.
[package]
name = "dioxus-native"
version = "0.7.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Native renderer for Dioxus based on blitz"
repository = "https://github.com/DioxusLabs/dioxus/"
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
name = "dioxus_native"
path = "src/lib.rs"

[features]
accessibility = ["blitz-shell/accessibility", "blitz-dom/accessibility"]
apple-font-embolden = ["blitz-paint/apple-font-embolden"]
autofocus = ["blitz-dom/autofocus"]
blitz-paint = ["dep:blitz-paint"]
complex-scripts = ["blitz-dom/complex-scripts"]
data-uri = ["blitz-shell/data-uri"]
default = ["accessibility", "hot-reload", "net", "html", "svg", "system-fonts", "file-dialog", "vello-hybrid", "woff", "text-transform-icu", "apple-font-embolden"]
file-dialog = ["blitz-shell/file-dialog"]
floats = ["blitz-dom/floats"]
font-embolden = ["blitz-paint/font-embolden"]
hot-reload = ["dep:dioxus-devtools"]
html = ["dep:blitz-html"]
log-frame-times = ["anyrender_vello_cpu?/log_frame_times", "anyrender_vello?/log_frame_times", "anyrender_vello_hybrid?/log_frame_times", "anyrender_skia?/log_frame_times"]
log-phase-times = ["blitz-dom/log-phase-times"]
log-times = ["log-phase-times", "log-frame-times"]
net = ["dep:tokio", "dep:blitz-net"]
prelude = ["dep:dioxus-core-macro", "dep:dioxus-hooks", "dep:dioxus-signals", "dep:dioxus-stores", "dep:manganis"]
scrollbars = ["blitz-paint/scrollbars"]
skia = ["dep:anyrender_skia"]
skia-pixels = ["skia-raster-base", "anyrender_skia/pixels_window_renderer"]
skia-raster-base = ["dep:anyrender_skia"]
skia-softbuffer = ["skia-raster-base", "anyrender_skia/softbuffer_window_renderer"]
svg = ["blitz-dom/svg", "blitz-paint/svg"]
system-fonts = ["blitz-dom/system-fonts"]
text-transform-icu = ["blitz-dom/text-transform-icu"]
tracing = ["dep:tracing", "dioxus-native-dom/tracing", "blitz-shell/tracing", "blitz-dom/tracing", "blitz-html/tracing", "blitz-net/tracing"]
vello = ["dep:anyrender_vello", "dep:wgpu_context"]
vello-cpu = ["vello-cpu-pixels"]
vello-cpu-base = ["dep:anyrender_vello_cpu"]
vello-cpu-pixels = ["vello-cpu-base", "anyrender_vello_cpu/pixels_window_renderer"]
vello-cpu-softbuffer = ["vello-cpu-base", "anyrender_vello_cpu/softbuffer_window_renderer"]
vello-hybrid = ["dep:anyrender_vello_hybrid", "dep:wgpu_context"]
woff = ["blitz-dom/woff"]
writing-mode = ["blitz-dom/writing-mode", "dioxus-native-dom/writing-mode"]

[dependencies]
anyrender = { path = "../anyrender", version = "*" }
anyrender_skia = { path = "../anyrender_skia", version = "*", optional = true }
anyrender_vello = { path = "../anyrender_vello", version = "*", optional = true }
anyrender_vello_cpu = { path = "../anyrender_vello_cpu", version = "*", optional = true }
anyrender_vello_hybrid = { path = "../anyrender_vello_hybrid", version = "*", optional = true }
blitz-dom = { path = "../blitz-dom", version = "=0.3.0-beta.4", default-features = false, features = ["custom-widget"] }
blitz-html = { path = "../blitz-html", version = "=0.3.0-beta.4", default-features = false, optional = true }
blitz-net = { path = "../blitz-net", version = "=0.3.0-beta.4", default-features = false, optional = true }
blitz-paint = { path = "../blitz-paint", version = "=0.3.0-beta.4", default-features = false, features = ["custom-widget"], optional = true }
blitz-shell = { path = "../blitz-shell", version = "=0.3.0-beta.4", default-features = false }
blitz-traits = { path = "../blitz-traits", version = "=0.3.0-beta.4", default-features = false }
cfg-if = { version = "^1.0.4" }
dioxus-asset-resolver = { version = "^0.8.0-alpha.3", features = ["native"] }
dioxus-cli-config = { version = "^0.8.0-alpha.3" }
dioxus-core = { version = "^0.8.0-alpha.3" }
dioxus-core-macro = { version = "^0.8.0-alpha.3", optional = true }
dioxus-devtools = { version = "^0.8.0-alpha.3", optional = true }
dioxus-document = { version = "^0.8.0-alpha.3" }
dioxus-history = { version = "^0.8.0-alpha.3" }
dioxus-hooks = { version = "^0.8.0-alpha.3", optional = true }
dioxus-html = { version = "^0.8.0-alpha.3" }
dioxus-native-dom = { path = "../dioxus-native-dom", version = "^0.7.0", default-features = false }
dioxus-signals = { version = "^0.8.0-alpha.3", optional = true }
dioxus-stores = { version = "^0.8.0-alpha.3", optional = true }
futures-util = { version = "^0.3.30" }
keyboard-types = { version = "^0.8" }
manganis = { version = "^0.8.0-alpha.3", features = ["dioxus"], optional = true }
peniko = { version = "^0.6.0" }
slotmap = { version = "^1.0.7" }
tokio = { version = "^1.42", features = ["rt"], optional = true }
tracing = { version = "^0.1.40", optional = true }
webbrowser = { version = "^1.0" }
wgpu_context = { path = "../wgpu_context", version = "*", optional = true }
winit = { version = "=0.31.0-beta.4" }

[target."cfg(all(target_os = \"ios\", target_abi = \"sim\"))".dependencies]
anyrender_vello_cpu = { path = "../anyrender_vello_cpu", version = "*", features = ["pixels_window_renderer"] }

[target."cfg(not(target_arch = \"wasm32\"))".dependencies]
tokio = { version = "^1.42", features = ["rt-multi-thread"], optional = true }

[target."cfg(target_os = \"android\")".dependencies]
android-activity = { version = "^0.6", default-features = false }

[lints.rust]
unexpected_cfgs = "allow"
