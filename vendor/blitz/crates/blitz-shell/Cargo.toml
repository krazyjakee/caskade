# Generated by vendor/blitz/normalize.py from the patched upstream manifest.
[package]
name = "blitz-shell"
version = "0.3.0-beta.4"
edition = "2024"
rust-version = "1.91.0"
license = "MIT OR Apache-2.0"
description = "Blitz application shell"
repository = "https://github.com/dioxuslabs/blitz"
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
name = "blitz_shell"
path = "src/lib.rs"

[features]
accessibility = ["dep:accesskit", "dep:accesskit_xplat", "blitz-dom/accessibility"]
custom-widget = ["blitz-dom/custom-widget"]
data-uri = ["dep:data-url"]
default = ["accessibility", "file-dialog"]
file-dialog = ["dep:rfd"]
tracing = ["dep:tracing", "blitz-dom/tracing"]

[dependencies]
accesskit = { version = "^0.25", optional = true }
accesskit_xplat = { path = "../accesskit_xplat", version = "^0.2", default-features = false, optional = true }
anyrender = { path = "../anyrender", version = "*" }
atomic_refcell = { version = "^0.1.13" }
blitz-dom = { path = "../blitz-dom", version = "=0.3.0-beta.4", default-features = false }
blitz-paint = { path = "../blitz-paint", version = "=0.3.0-beta.4", default-features = false }
blitz-traits = { path = "../blitz-traits", version = "=0.3.0-beta.4", default-features = false }
data-url = { version = "^0.3.1", optional = true }
futures-util = { version = "^0.3.30" }
keyboard-types = { version = "^0.8" }
tracing = { version = "^0.1.40", optional = true }
web-time = { version = "^1" }
webbrowser = { version = "^1.0", optional = true }
winit = { version = "=0.31.0-beta.4" }

[target."cfg(any(target_os = \"windows\", target_os = \"macos\", target_os = \"linux\", target_os = \"freebsd\", target_os = \"dragonfly\", target_os = \"netbsd\", target_os = \"openbsd\"))".dependencies]
rfd = { version = "^0.17.1", default-features = false, features = ["xdg-portal"], optional = true }

[target."cfg(target_arch = \"wasm32\")".dependencies]
wasm-bindgen = { version = "^0.2" }
web-sys = { version = "^0.3.98", features = ["HtmlCanvasElement", "Window"] }

[target."cfg(target_os = \"android\")".dependencies]
android-activity = { version = "^0.6.0" }

[lints.rust]
unexpected_cfgs = "allow"
