# Generated by vendor/blitz/normalize.py from the patched upstream manifest.
[package]
name = "blitz-paint"
version = "0.3.0-beta.4"
edition = "2024"
rust-version = "1.91.0"
license = "MIT OR Apache-2.0"
description = "Paint a Blitz Document using anyrender"
repository = "https://github.com/dioxuslabs/blitz"
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
name = "blitz_paint"
path = "src/lib.rs"

[features]
apple-font-embolden = []
custom-widget = ["blitz-dom/custom-widget"]
default = ["svg"]
font-embolden = []
scrollbars = ["blitz-dom/scrollbars"]
svg = ["dep:anyrender_svg", "dep:usvg", "dep:resvg", "blitz-dom/svg"]
tracing = ["dep:tracing"]

[dependencies]
anyrender = { path = "../anyrender", version = "*" }
anyrender_svg = { path = "../anyrender_svg", version = "*", optional = true }
blitz-dom = { path = "../blitz-dom", version = "=0.3.0-beta.4", default-features = false }
blitz-traits = { path = "../blitz-traits", version = "=0.3.0-beta.4", default-features = false }
bytemuck = { version = "^1" }
color = { version = "^0.3" }
euclid = { version = "^0.22" }
kurbo = { version = "^0.13.1" }
parley = { version = "^0.12", default-features = false, features = ["std", "bytemuck"] }
peniko = { version = "^0.6.0" }
resvg = { version = "^0.48", default-features = false, optional = true }
skrifa = { version = "^0.44", default-features = false, features = ["std"] }
smallvec = { version = "^1" }
style = { package = "stylo", path = "../stylo", version = "^0.23.0" }
taffy = { path = "../taffy", version = "*", default-features = false, features = ["std", "flexbox", "flexbox_balance", "grid", "block_layout", "content_size", "calc", "detailed_layout_info"] }
tracing = { version = "^0.1.40", optional = true }
usvg = { version = "^0.48.1", optional = true }

[lints.rust]
unexpected_cfgs = "allow"
