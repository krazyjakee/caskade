# Generated by vendor/blitz/normalize.py from the patched upstream manifest.
[package]
name = "dioxus-native-dom"
version = "0.7.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Core headless native renderer for Dioxus based on blitz"
repository = "https://github.com/DioxusLabs/dioxus/"
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
name = "dioxus_native_dom"
path = "src/lib.rs"

[features]
accessibility = ["blitz-dom/accessibility"]
autofocus = ["blitz-dom/autofocus"]
complex-scripts = ["blitz-dom/complex-scripts"]
default = ["accessibility", "svg", "system-fonts", "text-transform-icu"]
floats = ["blitz-dom/floats"]
svg = ["blitz-dom/svg"]
system-fonts = ["blitz-dom/system-fonts"]
text-transform-icu = ["blitz-dom/text-transform-icu"]
tracing = ["dep:tracing", "blitz-dom/tracing"]
writing-mode = ["blitz-dom/writing-mode"]

[dependencies]
blitz-dom = { path = "../blitz-dom", version = "=0.3.0-beta.4", default-features = false, features = ["custom-widget"] }
blitz-traits = { path = "../blitz-traits", version = "=0.3.0-beta.4", default-features = false }
dioxus-core = { version = "^0.8.0-alpha.3" }
dioxus-html = { version = "^0.8.0-alpha.3" }
futures-util = { version = "^0.3.30" }
keyboard-types = { version = "^0.8" }
tracing = { version = "^0.1.40", optional = true }

[lints.rust]
unexpected_cfgs = "allow"
