# Generated by vendor/blitz/normalize.py from the patched upstream manifest.
[package]
name = "taffy"
version = "0.15.0"
edition = "2021"
rust-version = "1.71"
license = "MIT"
description = "A flexible UI layout library "
repository = "https://github.com/DioxusLabs/taffy"
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
name = "taffy"
path = "src/lib.rs"

[features]
alloc = []
block_layout = []
calc = []
content_size = []
debug = ["std"]
default = ["std", "taffy_tree", "flexbox", "flexbox_balance", "grid", "block_layout", "float_layout", "calc", "content_size", "detailed_layout_info"]
detailed_layout_info = []
document-features = ["dep:document-features"]
flexbox = []
flexbox_balance = ["flexbox"]
float_layout = []
grid = ["dep:smallvec"]
parse = ["dep:cssparser"]
parse_faster = ["parse", "cssparser/fast_match_byte"]
profile = ["std"]
serde = ["dep:serde", "serde/alloc"]
std = ["serde?/std", "slotmap?/std"]
strict_provenance = []
taffy_tree = ["dep:slotmap"]

[dependencies]
cssparser = { version = "^0.37.0", default-features = false, optional = true }
document-features = { version = "^0.2.7", optional = true }
serde = { version = "^1.0", default-features = false, features = ["serde_derive"], optional = true }
slotmap = { version = "^1.0.6", default-features = false, optional = true }
smallvec = { version = "^1.13", default-features = false, optional = true }

[lints.rust]
unexpected_cfgs = "allow"
