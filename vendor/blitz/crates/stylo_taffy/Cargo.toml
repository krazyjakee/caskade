flexbox = ["taffy/flexbox", "taffy/flexbox_balance"]
floats = ["taffy/float_layout"]
grid = ["taffy/grid"]
std = ["taffy/std"]
writing-mode = []

[dependencies]
bitflags = { version = "^2.8.0" }
style = { package = "stylo", path = "../stylo", version = "^0.23.0" }
style_atoms = { package = "stylo_atoms", path = "../stylo_atoms", version = "^0.23.0" }
taffy = { path = "../taffy", version = "*", default-features = false, features = ["std", "flexbox", "flexbox_balance", "grid", "block_layout", "content_size", "calc", "detailed_layout_info"] }

[lints.rust]
unexpected_cfgs = "allow"
