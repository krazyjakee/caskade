[package]
name = "stylo_taffy"
version = "0.3.0-beta.4"
edition = "2024"
rust-version = "1.91.0"
license = "MIT OR Apache-2.0 OR MPL-2.0"
description = "Interop crate for the stylo and taffy crates"
repository = "https://github.com/dioxuslabs/blitz"
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
name = "stylo_taffy"
