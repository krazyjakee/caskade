# Generated by vendor/blitz/normalize.py from the patched upstream manifest.
[package]
name = "blitz-dom"
version = "0.3.0-beta.4"
edition = "2024"
rust-version = "1.91.0"
license = "MIT OR Apache-2.0"
description = "Blitz DOM implementation"
repository = "https://github.com/dioxuslabs/blitz"
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
name = "blitz_dom"
path = "src/lib.rs"

[features]
accessibility = ["accesskit"]
accesskit = ["dep:accesskit"]
autofocus = []
complex-scripts = ["parley/complex-scripts"]
custom-widget = ["dep:anyrender", "accessibility"]
default = ["svg", "woff", "accessibility", "system-fonts", "file-input", "custom-widget", "text-transform-icu"]
devtools = []
file-input = []
floats = ["taffy/float_layout", "stylo_taffy/floats"]
log-phase-times = ["debug_timer/enable"]
parallel-construct = []
scrollbars = []
svg = ["dep:usvg", "dep:svgtypes"]
system-fonts = ["parley/system"]
text-transform-icu = ["dep:icu_casemap", "dep:writeable"]
tracing = ["dep:tracing"]
woff = ["dep:wuff"]
writing-mode = ["stylo_taffy/writing-mode"]

[dependencies]
accesskit = { version = "^0.25", optional = true }
anyrender = { path = "../anyrender", version = "*", optional = true }
app_units = { version = "^0.7.5" }
atomic_refcell = { version = "^0.1.13" }
bitflags = { version = "^2.8.0" }
blitz-traits = { path = "../blitz-traits", version = "=0.3.0-beta.4", default-features = false }
color = { version = "^0.3" }
cssparser = { version = "^0.38.0" }
cursor-icon = { version = "^1" }
debug_timer = { path = "../debug_timer", version = "^0.1.2" }
euclid = { version = "^0.22" }
html-escape = { version = "^0.2.13" }
icu_casemap = { version = "^2.3", default-features = false, features = ["compiled_data"], optional = true }
icu_locale_core = { version = "^2.3", default-features = false }
icu_properties = { version = "^2.3", default-features = false, features = ["compiled_data"] }
icu_segmenter = { version = "^2.3", default-features = false, features = ["compiled_data"] }
image = { version = "^0.25.6", default-features = false }
keyboard-types = { version = "^0.8" }
kurbo = { version = "^0.13.1" }
linebender_resource_handle = { version = "^0.1" }
markup5ever = { version = "^0.40.0" }
parley = { version = "^0.12", default-features = false, features = ["std"] }
percent-encoding = { version = "^2.3.1" }
rayon = { version = "^1" }
selectors = { package = "selectors", path = "../selectors", version = "^0.42.0" }
skrifa = { version = "^0.44", default-features = false, features = ["std"] }
slotmap = { version = "^1.0.7" }
smallvec = { version = "^1" }
style = { package = "stylo", path = "../stylo", version = "^0.23.0" }
style_config = { package = "stylo_static_prefs", path = "../stylo_static_prefs", version = "^0.23.0" }
style_dom = { package = "stylo_dom", path = "../stylo_dom", version = "^0.23.0" }
style_traits = { package = "stylo_traits", path = "../stylo_traits", version = "^0.23.0" }
stylo_taffy = { path = "../stylo_taffy", version = "=0.3.0-beta.4", default-features = false, features = ["default"] }
svgtypes = { version = "^0.16.1", optional = true }
taffy = { path = "../taffy", version = "*", default-features = false, features = ["std", "flexbox", "flexbox_balance", "grid", "block_layout", "content_size", "calc", "detailed_layout_info"] }
thin-vec = { version = "^0.2" }
thread_local = { version = "^1" }
tracing = { version = "^0.1.40", optional = true }
url = { version = "^2.5.0" }
usvg = { version = "^0.48.1", optional = true }
web-time = { version = "^1" }
writeable = { version = "^0.6", default-features = false, optional = true }
wuff = { version = "^0.2", optional = true }

[target."cfg(any(target_vendor = \"apple\"))".dependencies]
objc2 = { version = "^0.6", features = ["disable-encoding-assertions"] }

[lints.rust]
unexpected_cfgs = "allow"
