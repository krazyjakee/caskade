[package]
name = "howlongtobeat"
version = "0.2.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
caskade-plugin-sdk = { path = "../../../../crates/caskade-plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Outbound HTTP through wasi:http; the host allows only the manifest's hosts.
wasi = "0.14"

[profile.release]
opt-level = "s"
lto = true
strip = true

# An example plugin, outside the Caskade workspace.
[workspace]
