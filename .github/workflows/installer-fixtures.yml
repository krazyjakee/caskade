# Rebuilds the genuine installer fixtures on GitHub-hosted Windows, Linux and
# macOS runners and proposes the result as a PR from automation/installer-fixtures.
# Trusted sources only: master pushes that touch a fixture builder, or a manual
# run. Ordinary tests never invoke these builders.
name: installer-fixtures
on:
  workflow_dispatch:
    inputs:
      propose:
        description: Push changed fixtures and open the review PR
        type: boolean
        default: true
  push:
    branches: [master]
    paths:
      - "crates/caskade-installer/tests/fixtures/src/**"
      - "crates/caskade-installer/tests/fixture-game/**"
      - "xtask/**"
      - ".github/workflows/installer-fixtures.yml"
permissions:
  contents: read
concurrency:
  group: installer-fixtures
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
jobs:
  windows:
    if: github.ref == 'refs/heads/master'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out without line-ending conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record the toolchain
        shell: pwsh
        run: |
          rustc -Vv
          python --version
      - name: Build genuine Inno and NSIS families with verified downloads
        shell: pwsh
        env:
          PYTHON: python
        run: cargo xtask fixtures windows --prepare --families inno,nsis --artifact target/fixture-artifact
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixtures-windows
          path: target/fixture-artifact
  linux:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Wine, MinGW, dpkg, 7-Zip, Flatpak and the libraries the unpacked msitools need
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            wine wine32 wine64 xvfb xauth gcc-mingw-w64-x86-64 dpkg-dev p7zip-full flatpak \
            libgsf-1-114 libgcab-1.0-0
      - name: Provision the pinned official sidecar
        run: python3 scripts/7zz-download.py --platform linux-x64
      - name: Build MSI, SFX and portable mini installers
        env:
          CASKADE_7ZZ: target/sidecars/7zip/26.05/linux-x64/7zz
        run: cargo xtask fixtures windows --prepare --families msi,sfx,archives --artifact target/fixture-artifact
      - name: Build genuine WiX Burn bundle with verified toolchain
        # `cargo xtask fixtures burn` has no --artifact; propose checks the lock.
        run: python3 xtask/burn-fixtures.py --artifact target/fixture-artifact
      - name: Build genuine Linux minis and acceptance catalogue
        run: |
          cargo xtask fixtures linux-shell --prepare
          cargo xtask fixtures appimage --prepare
          cargo xtask fixtures packages
          cargo xtask fixtures flatpak
          cargo xtask fixtures linux-mini
          python3 - <<'PYTHON'
          from pathlib import Path
          import shutil
          source = Path('crates/caskade-installer/tests/fixtures')
          artifact = Path('target/fixture-artifact')
          for directory in ['bin/linux-shell', 'bin/appimage', 'bin/packages', 'bin/flatpak', 'bin/linux-mini', 'expected/linux-shell', 'expected/appimage', 'expected/packages', 'expected/flatpak', 'expected/linux-mini']:
              shutil.copytree(source / directory, artifact / directory, dirs_exist_ok=True)
          PYTHON
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixtures-linux
          path: target/fixture-artifact
  macos:
    if: github.ref == 'refs/heads/master'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record native Apple toolchain
        run: |
          sw_vers
          rustc -Vv
          xcrun clang --version
      - name: Build genuine UDZO, ULFO, SLA and native package fixtures
        run: python3 xtask/macos-fixtures.py --artifact target/macos-fixture-artifact
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixtures-macos
          path: target/macos-fixture-artifact
  propose:
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.FIXTURE_PR_TOKEN || github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fixtures-windows
          path: crates/caskade-installer/tests/fixtures
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fixtures-linux
          path: crates/caskade-installer/tests/fixtures
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fixtures-macos
          path: crates/caskade-installer/tests/fixtures
      - name: Finalize combined inventory and check budgets
        run: |
          cargo xtask fixtures record-build
          cargo xtask fixtures check
          cargo test -p xtask --locked
      - name: Changed fixture outputs
        run: git status --short -- crates/caskade-installer/tests/fixtures
      - name: Commit only generated fixture outputs
        id: commit
        if: github.event_name == 'push' || inputs.propose
        run: |
          git config user.name 'Caskade fixture bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B automation/installer-fixtures
          git add -- crates/caskade-installer/tests/fixtures/bin/burn crates/caskade-installer/tests/fixtures/expected/burn crates/caskade-installer/tests/fixtures/bin/windows crates/caskade-installer/tests/fixtures/expected/windows crates/caskade-installer/tests/fixtures/bin/macos-native crates/caskade-installer/tests/fixtures/expected/macos-native crates/caskade-installer/tests/fixtures/bin/linux-shell crates/caskade-installer/tests/fixtures/bin/appimage crates/caskade-installer/tests/fixtures/bin/packages crates/caskade-installer/tests/fixtures/bin/flatpak crates/caskade-installer/tests/fixtures/bin/linux-mini crates/caskade-installer/tests/fixtures/expected/linux-shell crates/caskade-installer/tests/fixtures/expected/appimage crates/caskade-installer/tests/fixtures/expected/packages crates/caskade-installer/tests/fixtures/expected/flatpak crates/caskade-installer/tests/fixtures/expected/linux-mini crates/caskade-installer/tests/fixtures/build.lock
          if git diff --cached --quiet; then
            echo "The rebuilt fixtures match master."
            exit 0
          fi
          git commit -m 'Refresh genuine Windows, Linux and macOS installer fixtures (#34, #40, #44)'
          git push --force origin automation/installer-fixtures
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Open the review PR
        if: steps.commit.outputs.pushed == 'true'
        env:
          FIXTURE_PR_TOKEN: ${{ secrets.FIXTURE_PR_TOKEN || github.token }}
        run: python3 xtask/fixture-pr.py
