name: discovery-nightly
# Ten-minute libFuzzer runs of every discovery parser target and the release
# performance budget, on master only (schedule or manual run), on
# GitHub-hosted runners. Each target's mutated corpus carries over between
# nights in the Actions cache, bounded by xtask/runner/fuzz-corpus.py. See
# crates/caskade-discovery/fuzz/README.md.
on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: discovery-nightly
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
jobs:
  targets:
    if: github.repository == 'krazyjakee/caskade' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      targets: ${{ steps.discover.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: discover
        name: Discover every registered discovery robustness target
        run: echo "targets=$(python3 crates/caskade-discovery/fuzz/run.py --list-targets)" >> "$GITHUB_OUTPUT"

  fuzz:
    if: github.repository == 'krazyjakee/caskade' && github.ref == 'refs/heads/master'
    needs: targets
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.targets.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Nightly Rust toolchain
        run: |
          rustup toolchain install nightly --profile minimal
          rustc +nightly -Vv
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-fuzz
      # The newest corpus any earlier night saved for this target.
      - name: Restore the retained corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/corpus
          key: discovery-fuzz-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: discovery-fuzz-${{ matrix.target }}-
      - name: Seed the bounded discovery-only corpus
        run: python3 xtask/runner/fuzz-corpus.py "$RUNNER_TEMP/corpus" crates/caskade-discovery/fuzz/corpus/${{ matrix.target }}
      - name: Ten-minute bounded parser robustness run
        run: python3 crates/caskade-discovery/fuzz/run.py ${{ matrix.target }} --seconds 600
      - name: Retain bounded mutations for the next run
        if: always()
        run: python3 xtask/runner/fuzz-corpus.py crates/caskade-discovery/fuzz/corpus/${{ matrix.target }} "$RUNNER_TEMP/corpus"
      - name: Save the retained corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/corpus
          key: discovery-fuzz-${{ matrix.target }}-${{ github.run_id }}
      - name: Upload compact measured evidence for the seven-day audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: discovery-evidence-${{ matrix.target }}-${{ github.run_id }}
          path: crates/caskade-discovery/fuzz/logs/**/result.json
          retention-days: 30
      - name: Upload reports, corpus and run evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: discovery-fuzz-${{ matrix.target }}-${{ github.run_id }}
          path: |
            crates/caskade-discovery/fuzz/logs/**
            crates/caskade-discovery/fuzz/artifacts/**
            crates/caskade-discovery/fuzz/corpus/${{ matrix.target }}
          retention-days: 14

  performance:
    if: github.repository == 'krazyjakee/caskade' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CASKADE_DISCOVERY_PERF_OUTPUT: ${{ github.workspace }}/target/discovery-performance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc -Vv
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: discovery-performance
      - name: Verify generated fixture provenance and privacy
        run: cargo xtask discovery check
      - name: Strict release budget for 1000 games in ten Steam libraries and every launcher
        run: cargo test -p caskade-discovery --all-features --locked --release --test performance -- --ignored --nocapture --test-threads=1
      - name: Upload aggregate synthetic performance measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: discovery-performance-${{ github.run_id }}
          path: target/discovery-performance/**
          retention-days: 30
