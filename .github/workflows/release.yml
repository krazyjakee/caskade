name: release
# Builds Caskade from a `v*` tag for Linux, Windows and macOS, and uploads the
# bundles, their updater signatures and `latest.json` to a draft GitHub
# release. The build legs run with a read-only token and never see the
# updater signing key: build scripts, proc-macros and npm packages run there.
# Only the `sign` job holds the key, and it runs nothing but the pinned Tauri
# CLI's `signer sign` on the legs' artifacts (the CLI is a build tool here:
# it bundles and signs; the app has no Tauri runtime). Before it, `notarize`
# signs the macOS app and dmg with the Developer ID and has Apple notarize
# them (scripts/macos/sign.sh); only that job holds the Apple secrets, and it
# runs no project dependencies either. `windows-sign` (sign-windows.yml) does
# the same for Windows with Certum's cloud certificate: it bundles the build
# leg's executable again, signed, and only it holds the SimplySign secrets.
# Publishing the draft
# by hand is what ships it: the in-app updater
# reads releases/latest/download/latest.json, and releases/latest skips
# drafts. See docs/RELEASING.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build again, e.g. v0.1.0 (it must already be pushed)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  TAG: ${{ inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always

jobs:
  # Everything that can fail without a build: the secrets, the key and its
  # password, the versions. Then the draft release the sign job uploads to.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      release-id: ${{ steps.release.outputs.id }}
    steps:
      - name: Updater signing secrets are set
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || missing="$missing TAURI_SIGNING_PRIVATE_KEY"
          [ -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ] || missing="$missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error title=Updater signing secrets missing::Set the repository secret(s)$missing (Settings > Secrets and variables > Actions). Without them the bundles can't be signed for the in-app updater. See docs/RELEASING.md, One-time setup."
            exit 1
          fi

      # A macOS release that isn't notarized is one Gatekeeper refuses to
      # open after a download, so there is no unsigned fallback.
      - name: macOS signing secrets are set
        env:
          MACOS_SIGNING_PEM_B64: ${{ secrets.MACOS_SIGNING_PEM_B64 }}
          MACOS_NOTARY_KEY_B64: ${{ secrets.MACOS_NOTARY_KEY_B64 }}
        run: |
          missing=""
          [ -n "$MACOS_SIGNING_PEM_B64" ] || missing="$missing MACOS_SIGNING_PEM_B64"
          [ -n "$MACOS_NOTARY_KEY_B64" ] || missing="$missing MACOS_NOTARY_KEY_B64"
          if [ -n "$missing" ]; then
            echo "::error title=macOS signing secrets missing::Set the repository secret(s)$missing (Settings > Secrets and variables > Actions). Without them the macOS app can't be signed and notarized. See docs/RELEASING.md, One-time setup."
            exit 1
          fi

      # Same for Windows: an unsigned installer is one SmartScreen warns
      # about, so a release never falls back to one.
      - name: Windows signing secrets are set
        env:
          SIMPLYSIGN_USER: ${{ secrets.SIMPLYSIGN_USER }}
          SIMPLYSIGN_TOTP_SECRET: ${{ secrets.SIMPLYSIGN_TOTP_SECRET }}
        run: |
          missing=""
          [ -n "$SIMPLYSIGN_USER" ] || missing="$missing SIMPLYSIGN_USER"
          [ -n "$SIMPLYSIGN_TOTP_SECRET" ] || missing="$missing SIMPLYSIGN_TOTP_SECRET"
          if [ -n "$missing" ]; then
            echo "::error title=Windows signing secrets missing::Set the repository secret(s)$missing (Settings > Secrets and variables > Actions). Without them the Windows installer can't be code-signed. See docs/RELEASING.md, Windows code signing."
            exit 1
          fi

      - name: Tag is vX.Y.Z
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error title=Bad tag::'$TAG' is not a release tag: use vX.Y.Z or vX.Y.Z-suffix."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Tag matches the app's version
        id: version
        run: |
          python3 scripts/check-release-metadata.py "${TAG#v}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # Signs a scratch file with the secret key, then checks that the
      # signature's key id is the committed public key's. A wrong password or
      # a key from another pair fails here instead of after four builds. The
      # Tauri CLI's version is the one pnpm-lock.yaml pins for apps/native.
      - name: Signing key works and matches the committed public key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cli=$(sed -nE "s/^  '@tauri-apps\/cli@([0-9][^'(]*)':.*/\1/p" pnpm-lock.yaml | head -n1)
          if [ -z "$cli" ]; then
            echo "::error::Can't find @tauri-apps/cli's version in pnpm-lock.yaml."
            exit 1
          fi
          probe="$RUNNER_TEMP/signing-probe"
          echo "caskade $TAG" > "$probe"
          if ! npx --yes "@tauri-apps/cli@$cli" signer sign "$probe" > /dev/null; then
            echo "::error title=Signing failed::The TAURI_SIGNING_PRIVATE_KEY secret isn't a Tauri private key, or TAURI_SIGNING_PRIVATE_KEY_PASSWORD isn't its password."
            exit 1
          fi
          python3 - "$probe.sig" <<'PY'
          import base64, sys

          def key_id(wrapped):
              # Tauri stores minisign keys and signatures base64-encoded; the
              # second line holds the algorithm (2 bytes) then the key id (8).
              return base64.b64decode(base64.b64decode(wrapped).decode().splitlines()[1])[2:10]

          conf = "crates/caskade-app/updater.pub"
          pubkey = open(conf).read().strip()
          if not pubkey:
              print(f"::error file={conf},title=No updater public key::The updater public key is missing in {conf}.")
              sys.exit(1)
          signed, committed = key_id(open(sys.argv[1]).read()), key_id(pubkey)
          if signed != committed:
              print(
                  f"::error title=Wrong signing key::The secret key (id {signed[::-1].hex().upper()}) is not the pair of "
                  f"the public key in {conf} (id {committed[::-1].hex().upper()}). Installed copies would reject the update."
              )
              sys.exit(1)
          print(f"Signing key {committed[::-1].hex().upper()} matches {conf}")
          PY

      # The draft, made before the builds, so a refused tag (a published
      # release) stops the run before anything builds.
      - name: Draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          existing=$(gh api "repos/$REPO/releases?per_page=100" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | \"\(.id) \(.draft)\"" | head -n1)
          if [ -n "$existing" ]; then
            read -r id draft <<< "$existing"
            if [ "$draft" != "true" ]; then
              echo "::error title=Already published::The release for $TAG is published. Don't replace a published release's files: bump the version and tag again."
              exit 1
            fi
            echo "Uploading to the existing draft for $TAG (id $id)"
          else
            prerelease=false
            [[ "$VERSION" == *-* ]] && prerelease=true
            notes=$(python3 scripts/changelog-notes.py --allow-unreleased "$VERSION")
            downloads=$(cat <<'BODY'
          ## Downloads

          - Windows: `Caskade_@VERSION@_x64-setup.exe`
          - macOS: `Caskade_@VERSION@_aarch64.dmg` (Apple silicon) or `Caskade_@VERSION@_x64.dmg` (Intel)
          - Linux: `Caskade_@VERSION@_amd64.AppImage`, or `Caskade_@VERSION@_amd64.deb` for Debian and Ubuntu
          - Checksums: `SHA256SUMS`

          The Windows install, the macOS app, the AppImage and the .deb update themselves from inside Caskade (the .deb asks for your password once). A .deb of 0.1.1 or earlier doesn't: install this .deb over it once.

          The macOS app is signed and notarized by Apple. The Windows installer and the Caskade it installs are code-signed.
          BODY
            )
            downloads=${downloads//@VERSION@/$VERSION}
            if [ -n "$notes" ]; then
              body=$(printf '%s\n\n%s\n' "$notes" "$downloads")
            else
              body="$downloads"
            fi
            id=$(gh api "repos/$REPO/releases" \
              -f tag_name="$TAG" -f name="Caskade $VERSION" -f body="$body" \
              -F draft=true -F prerelease="$prerelease" --jq .id)
            echo "Created a draft release for $TAG (id $id)"
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/build-bundles.yml
    with:
      ref: refs/tags/${{ inputs.tag || github.ref_name }}
      version: ${{ needs.prepare.outputs.version }}

  # The only job with the Apple secrets: signs each macOS leg's app (and the
  # 7zz in it) with the Developer ID and the hardened runtime, has Apple
  # notarize the app and the dmg, staples the tickets, and checks the result
  # with macOS's own codesign, spctl and stapler. It runs the repo's
  # scripts/macos/sign.sh and the pinned rcodesign, and installs no project
  # dependencies. The updater signatures come after, over the notarized files.
  notarize:
    needs: [prepare, build]
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundles-${{ matrix.target }}
          path: ${{ runner.temp }}/bundles

      - name: rcodesign
        env:
          VERSION: "0.29.0"
          SHA256: d98372d5524226ccf9dc0eda03d4e4f5826182dabb2fc3f2bd303ed9113a748d
        run: |
          name="apple-codesign-$VERSION-macos-universal"
          curl -fsSL -o "$RUNNER_TEMP/$name.tar.gz" \
            "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign/$VERSION/$name.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/$name.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          echo "RCODESIGN=$RUNNER_TEMP/$name/rcodesign" >> "$GITHUB_ENV"

      - name: Sign and notarize
        env:
          MACOS_SIGNING_PEM_B64: ${{ secrets.MACOS_SIGNING_PEM_B64 }}
          MACOS_NOTARY_KEY_B64: ${{ secrets.MACOS_NOTARY_KEY_B64 }}
        run: |
          shopt -s nullglob
          tarballs=("$RUNNER_TEMP"/bundles/*.app.tar.gz) dmgs=("$RUNNER_TEMP"/bundles/*.dmg)
          if [ ${#tarballs[@]} -ne 1 ] || [ ${#dmgs[@]} -ne 1 ]; then
            echo "::error title=macOS bundles::Expected one .app.tar.gz and one .dmg, found ${tarballs[*]} ${dmgs[*]}"
            exit 1
          fi
          scripts/macos/sign.sh --notarize "${tarballs[0]}" "${dmgs[0]}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notarized-${{ matrix.target }}
          path: ${{ runner.temp }}/bundles
          if-no-files-found: error
          retention-days: 7

  # Signs the Windows installer and what it installs (sign-windows.yml).
  windows-sign:
    needs: [prepare, build]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/sign-windows.yml
    with:
      ref: refs/tags/${{ inputs.tag || github.ref_name }}
    secrets:
      SIMPLYSIGN_USER: ${{ secrets.SIMPLYSIGN_USER }}
      SIMPLYSIGN_TOTP_SECRET: ${{ secrets.SIMPLYSIGN_TOTP_SECRET }}

  # The only job with the updater's signing key. It runs no project code and
  # installs no project dependencies: it signs the legs' updater bundles (the
  # notarized ones for macOS, the code-signed installer for Windows) with the
  # Tauri CLI version pinned in pnpm-lock.yaml, writes latest.json and
  # uploads everything to the draft in one go.
  sign:
    needs: [prepare, build, notarize, windows-sign]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundles-*
          path: ${{ runner.temp }}/release
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: notarized-*
          path: ${{ runner.temp }}/notarized
          merge-multiple: true

      # The build legs' macOS files are the unsigned ones: ship the
      # notarized files in their place, under the same names.
      - name: Take the notarized macOS bundles
        working-directory: ${{ runner.temp }}
        run: |
          shopt -s nullglob
          notarized=(notarized/*.dmg notarized/*.app.tar.gz)
          if [ ${#notarized[@]} -ne 4 ]; then
            echo "::error title=Notarized bundles::Expected two .dmg and two .app.tar.gz, found ${notarized[*]}"
            exit 1
          fi
          rm -f release/*.dmg release/*.app.tar.gz
          mv "${notarized[@]}" release/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-x86_64-pc-windows-msvc
          path: ${{ runner.temp }}/signed

      # And the code-signed Windows installer in place of the unsigned one.
      - name: Take the signed Windows installer
        working-directory: ${{ runner.temp }}
        run: |
          shopt -s nullglob
          signed=(signed/*-setup.exe) unsigned=(release/*-setup.exe)
          if [ ${#signed[@]} -ne 1 ] || [ ${#unsigned[@]} -ne 1 ] || [ "$(basename "${signed[0]}")" != "$(basename "${unsigned[0]}")" ]; then
            echo "::error title=Signed installer::Expected one signed and one unsigned setup .exe of the same name, found ${signed[*]} and ${unsigned[*]}"
            exit 1
          fi
          mv -f "${signed[0]}" release/

      # --app-version binds each signature to the version (a trusted
      # comment): the app's updater refuses a signature for another version
      # (crates/caskade-app/src/self_update.rs, verify).
      - name: Sign the updater bundles
        working-directory: ${{ runner.temp }}/release
        env:
          LOCKFILE: ${{ github.workspace }}/pnpm-lock.yaml
          VERSION: ${{ needs.prepare.outputs.version }}
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cli=$(sed -nE "s/^  '@tauri-apps\/cli@([0-9][^'(]*)':.*/\1/p" "$LOCKFILE" | head -n1)
          if [ -z "$cli" ]; then
            echo "::error::Can't find @tauri-apps/cli's version in pnpm-lock.yaml."
            exit 1
          fi
          shopt -s nullglob
          for file in *.AppImage *.deb *-setup.exe *.app.tar.gz; do
            npx --yes "@tauri-apps/cli@$cli" signer sign --app-version "$VERSION" "$file" > /dev/null
            echo "Signed $file"
          done

      - name: Write SHA256SUMS
        working-directory: ${{ runner.temp }}/release
        run: |
          shopt -s nullglob
          files=(*.AppImage *.deb *-setup.exe *.dmg *.app.tar.gz)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error title=SHA256SUMS::No release bundles found to hash."
            exit 1
          fi
          LC_ALL=C printf '%s\n' "${files[@]}" | sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS

      # The plain platform key, which the updater falls back to, and one per
      # bundle type (self_update.rs, Bundle::platforms). Windows prefers NSIS.
      - name: Write latest.json
        working-directory: ${{ runner.temp }}/release
        env:
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANGELOG: ${{ github.workspace }}/CHANGELOG.md
          NOTES_SCRIPT: ${{ github.workspace }}/scripts/changelog-notes.py
        run: |
          python3 - <<'PY'
          import glob, json, os, subprocess, sys
          from datetime import datetime, timezone
          from urllib.parse import quote

          repo, tag, version = (os.environ[k] for k in ("REPO", "TAG", "VERSION"))

          def one(pattern):
              found = glob.glob(pattern)
              if len(found) != 1:
                  print(f"::error title=latest.json::Expected one {pattern}, found {found}")
                  sys.exit(1)
              return found[0]

          def entry(pattern):
              name = one(pattern)
              return {
                  "signature": open(f"{name}.sig").read(),
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{quote(name)}",
              }

          notes = subprocess.check_output(
              [
                  sys.executable,
                  os.environ["NOTES_SCRIPT"],
                  "--changelog",
                  os.environ["CHANGELOG"],
                  "--allow-unreleased",
                  "--plain",
                  version,
              ],
              text=True,
          ).strip()
          appimage, deb, nsis = entry("*.AppImage"), entry("*.deb"), entry("*-setup.exe")
          mac_arm, mac_x64 = entry("*_aarch64.app.tar.gz"), entry("*_x64.app.tar.gz")
          manifest = {
              "version": version,
              "notes": notes,
              "pub_date": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%S.000Z"),
              "platforms": {
                  "linux-x86_64": appimage,
                  "linux-x86_64-appimage": appimage,
                  "linux-x86_64-deb": deb,
                  "windows-x86_64": nsis,
                  "windows-x86_64-nsis": nsis,
                  "darwin-aarch64": mac_arm,
                  "darwin-aarch64-app": mac_arm,
                  "darwin-x86_64": mac_x64,
                  "darwin-x86_64-app": mac_x64,
              },
          }
          with open("latest.json", "w") as out:
              json.dump(manifest, out, indent=2)
          PY
          ls -l

      # --clobber replaces files of the same name, so a re-run of the
      # workflow for the same tag refreshes the draft.
      - name: Upload to the draft release
        working-directory: ${{ runner.temp }}/release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh release upload "$TAG" --repo "$REPO" --clobber ./*

  # Reads the draft back as installed copies will: latest.json lists every
  # platform, and each entry points at a file on the release whose .sig it
  # carries, signed with the committed key for this version. Check it before
  # anyone publishes.
  verify:
    needs: [prepare, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: latest.json lists every platform, signed with the committed key
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_ID: ${{ needs.prepare.outputs.release-id }}
        run: |
          python3 - <<'PY'
          import base64, json, os, subprocess, sys
          from urllib.parse import unquote

          repo, tag, version, release = (os.environ[k] for k in ("REPO", "TAG", "VERSION", "RELEASE_ID"))

          def gh(*args):
              return subprocess.run(["gh", "api", *args], check=True, capture_output=True).stdout

          def download(name):
              return gh("-H", "Accept: application/octet-stream", f"repos/{repo}/releases/assets/{assets[name]}")

          def key_id(wrapped):
              return base64.b64decode(base64.b64decode(wrapped).decode().splitlines()[1])[2:10]

          def signed_version(wrapped):
              # minisign's trusted comment; `signer sign --app-version` adds
              # version:<v>, which the updater compares with latest.json's.
              for line in base64.b64decode(wrapped).decode().splitlines():
                  if line.startswith("trusted comment: "):
                      fields = line.removeprefix("trusted comment: ").split("\t")
                      return next((f.removeprefix("version:") for f in fields if f.startswith("version:")), None)
              return None

          assets = dict(
              reversed(line.split("\t", 1))
              for line in gh(f"repos/{repo}/releases/{release}/assets?per_page=100", "--paginate",
                             "--jq", ".[] | [(.id | tostring), .name] | @tsv").decode().splitlines()
          )
          if "latest.json" not in assets:
              print("::error title=No latest.json::The draft has no latest.json: see the sign job's log.")
              sys.exit(1)
          manifest = json.loads(download("latest.json"))
          pubkey = key_id(open("crates/caskade-app/updater.pub").read().strip())
          prefix = f"https://github.com/{repo}/releases/download/{tag}/"
          expected = {
              "linux-x86_64": ".AppImage",
              "windows-x86_64": "-setup.exe",
              "darwin-aarch64": ".app.tar.gz",
              "darwin-x86_64": ".app.tar.gz",
          }
          errors, rows = [], []
          if manifest.get("version") != version:
              errors.append(f"latest.json says version {manifest.get('version')}, the tag {tag}")
          platforms = manifest.get("platforms", {})
          for platform, suffix in expected.items():
              entry = platforms.get(platform)
              if not entry:
                  errors.append(f"{platform} is missing from latest.json: see the sign job's log")
                  continue
              url, signature = entry.get("url", ""), entry.get("signature", "")
              name = unquote(url[len(prefix):]) if url.startswith(prefix) else ""
              if not name or "/" in name or not name.endswith(suffix) or name not in assets:
                  errors.append(f"{platform}: {url} is not a {suffix} on this release")
                  continue
              if f"{name}.sig" not in assets or download(f"{name}.sig").decode().strip() != signature.strip():
                  errors.append(f"{platform}: the signature isn't {name}.sig's")
              elif key_id(signature) != pubkey:
                  errors.append(f"{platform}: signed with another key than caskade-app/updater.pub's")
              elif signed_version(signature) != version:
                  errors.append(f"{platform}: the signature is for version {signed_version(signature)}, not {version}")
              rows.append(f"| `{platform}` | `{name}` |")
          mac = [platforms[p]["url"] for p in ("darwin-aarch64", "darwin-x86_64") if p in platforms]
          if len(mac) == 2 and mac[0] == mac[1]:
              errors.append("darwin-aarch64 and darwin-x86_64 point at the same file")
          expected_notes = subprocess.check_output(
              [sys.executable, "scripts/changelog-notes.py", "--allow-unreleased", "--plain", version],
              text=True,
          ).strip()
          if expected_notes and not str(manifest.get("notes", "")).strip():
              errors.append("latest.json has empty notes even though CHANGELOG.md has an entry for this version")
          if "SHA256SUMS" not in assets:
              errors.append("SHA256SUMS is missing from the draft release")
          else:
              sums = {}
              for line in download("SHA256SUMS").decode().splitlines():
                  line = line.strip()
                  if not line:
                      continue
                  parts = line.split(None, 1)
                  if len(parts) != 2 or len(parts[0]) != 64:
                      errors.append(f"SHA256SUMS has malformed line: {line}")
                      continue
                  sums[parts[1].lstrip("*")] = parts[0]
              bundle_suffixes = (".AppImage", ".deb", "-setup.exe", ".dmg", ".app.tar.gz")
              expected_hashed = {name for name in assets if name.endswith(bundle_suffixes)}
              missing_sums = sorted(expected_hashed - set(sums))
              if missing_sums:
                  errors.append(f"SHA256SUMS is missing: {', '.join(missing_sums)}")
          for error in errors:
              print(f"::error title=latest.json::{error}")
          html = json.loads(gh(f"repos/{repo}/releases/{release}"))["html_url"]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"## Caskade {version}\n\nDraft: {html}\n\n| Updater platform | File |\n| --- | --- |\n")
              summary.write("\n".join(rows) + "\n")
              summary.write(f"\nOther entries in latest.json: {', '.join(sorted(set(platforms) - set(expected))) or 'none'}\n")
          if errors:
              sys.exit(1)
          print(f"::notice title=Draft ready::{html}: check it, then publish it to ship {tag}.")
          PY
