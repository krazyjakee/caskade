name: sign windows
# The Windows installer, code-signed: called by `release` (on the build leg's
# files from the same run) and by `windows-signing-smoke` (on a `bundles`
# run's). The only job with the SimplySign secrets. It logs in to Certum's
# cloud signing (scripts/windows/simplysign-login.ps1), then bundles the
# build leg's caskade.exe again with the Tauri CLI pinned in pnpm-lock.yaml,
# whose bundler signs caskade.exe, the NSIS plugins, the uninstaller and the
# setup .exe through scripts/windows/sign.ps1. It builds nothing and installs
# no project dependencies: the build leg ran those, without the secrets. The
# pinned 7-Zip stays unsigned (the app checks its hash), and a silent install
# checks the result. See docs/RELEASING.md, Windows code signing.
on:
  workflow_call:
    inputs:
      ref:
        description: The commit or tag the build leg built
        required: true
        type: string
      run-id:
        description: The run whose staged-x86_64-pc-windows-msvc artifact to sign (default this run)
        required: false
        type: string
        default: ""
    secrets:
      SIMPLYSIGN_USER:
        required: true
      SIMPLYSIGN_TOTP_SECRET:
        required: true
permissions:
  contents: read

jobs:
  sign:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    # Caskade's own runs share one SimplySign login. MoGen's and daccord's
    # releases use the same account: don't run theirs at the same time.
    concurrency:
      group: simplysign
      cancel-in-progress: false
    env:
      TARGET: x86_64-pc-windows-msvc
      WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL || 'http://time.certum.pl' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # caskade.exe under target/, the 7-Zip under apps/native/binaries, as
      # the build leg staged them for `tauri bundle`.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.run-id == ''
        with:
          name: staged-x86_64-pc-windows-msvc
          path: ${{ github.workspace }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.run-id != ''
        with:
          name: staged-x86_64-pc-windows-msvc
          path: ${{ github.workspace }}
          run-id: ${{ inputs.run-id }}
          github-token: ${{ github.token }}

      # For `cargo metadata --no-deps`, the bundler's only Cargo call.
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          rustup default 1.100.0

      - name: Tauri CLI
        shell: bash
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
        run: |
          cli=$(sed -nE "s/^  '@tauri-apps\/cli@([0-9][^'(]*)':.*/\1/p" pnpm-lock.yaml | head -n1)
          if [ -z "$cli" ]; then
            echo "::error::Can't find @tauri-apps/cli's version in pnpm-lock.yaml."
            exit 1
          fi
          npm install --prefix "$RUNNER_TEMP/tauri-cli" --no-save --no-package-lock "@tauri-apps/cli@$cli"

      - name: The pinned 7-Zip's hashes
        shell: pwsh
        run: |
          $files = @(Get-ChildItem apps/native/binaries -File -Include '7zz-*.exe', '7z.dll' -Recurse)
          if ($files.Count -ne 2) { throw "Expected the staged 7zz and 7z.dll, found: $($files.Name -join ', ')" }
          $files | ForEach-Object { "$($_.Name) $((Get-FileHash $_.FullName -Algorithm SHA256).Hash)" } |
            Set-Content "$env:RUNNER_TEMP/7zip.sha256"
          Get-Content "$env:RUNNER_TEMP/7zip.sha256"

      - name: Open the SimplySign session
        shell: pwsh
        env:
          SIMPLYSIGN_USER: ${{ secrets.SIMPLYSIGN_USER }}
          SIMPLYSIGN_TOTP_SECRET: ${{ secrets.SIMPLYSIGN_TOTP_SECRET }}
        run: ./scripts/windows/simplysign-login.ps1 -Required

      # The committed config with a sign command added: the bundler signs
      # through it, and leaves the sidecar 7zz alone
      # (TAURI_SKIP_SIDECAR_SIGNATURE_CHECK). It would sign the 7z.dll
      # resource; sign.ps1 refuses that. --no-binary-patching as in the
      # build leg. No updater key: the sign job signs the setup .exe for the
      # updater.
      - name: Bundle and sign
        shell: pwsh
        working-directory: apps/native
        env:
          TAURI_SKIP_SIDECAR_SIGNATURE_CHECK: "true"
        run: |
          $script = (Resolve-Path ../../scripts/windows/sign.ps1).Path -replace '\\', '/'
          $config = @{ bundle = @{ windows = @{ signCommand = @{
            cmd = 'pwsh'; args = @('-NoProfile', '-NonInteractive', '-File', $script, '%1')
          } } } } | ConvertTo-Json -Depth 6
          $configPath = Join-Path $env:RUNNER_TEMP 'windows-signing.json'
          Set-Content -Path $configPath -Value $config -Encoding utf8
          Get-Content $configPath
          & "$env:RUNNER_TEMP/tauri-cli/node_modules/.bin/tauri.cmd" bundle --target $env:TARGET --bundles nsis --config $configPath --no-binary-patching
          if ($LASTEXITCODE -ne 0) { throw "tauri bundle failed (exit $LASTEXITCODE)" }

      - name: The pinned 7-Zip is unchanged
        shell: pwsh
        run: |
          $now = Get-ChildItem apps/native/binaries -File -Include '7zz-*.exe', '7z.dll' -Recurse |
            ForEach-Object { "$($_.Name) $((Get-FileHash $_.FullName -Algorithm SHA256).Hash)" }
          $before = Get-Content "$env:RUNNER_TEMP/7zip.sha256"
          if (Compare-Object $before $now) { throw "Signing changed the pinned 7-Zip: before $before, after $now" }

      # Installs it as a user would (per user, silent, nothing started), then
      # checks what landed: our files signed and trusted, 7-Zip's the bytes
      # the app pins.
      - name: Check the installer
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem "target/$env:TARGET/release/bundle/nsis" -Filter '*-setup.exe')
          if ($setup.Count -ne 1) { throw "Expected one setup .exe, found: $($setup.Name -join ', ')" }
          $process = Start-Process -FilePath $setup[0].FullName -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "The silent install exited $($process.ExitCode)" }
          $installed = Join-Path $env:LOCALAPPDATA 'Caskade'
          $errors = @()
          foreach ($file in @($setup[0].FullName, "$installed/caskade.exe", "$installed/uninstall.exe")) {
            $signature = Get-AuthenticodeSignature -FilePath $file
            Write-Host "$file`: $($signature.Status), $($signature.SignerCertificate.Subject), timestamp $($signature.TimeStamperCertificate.Subject)"
            if ($signature.Status -ne 'Valid') { $errors += "$file is $($signature.Status)" }
            elseif (-not $signature.TimeStamperCertificate) { $errors += "$file has no timestamp" }
          }
          $staged = @{}
          Get-Content "$env:RUNNER_TEMP/7zip.sha256" | ForEach-Object { $name, $hash = $_ -split ' '; $staged[$name] = $hash }
          $pairs = @{ '7zz.exe' = "7zz-$env:TARGET.exe"; '7z.dll' = '7z.dll' }
          foreach ($name in $pairs.Keys) {
            $hash = (Get-FileHash (Join-Path $installed $name) -Algorithm SHA256).Hash
            if ($hash -ne $staged[$pairs[$name]]) { $errors += "the installed $name isn't the pinned one" }
          }
          if ($errors) { $errors | ForEach-Object { Write-Host "::error title=Windows signing::$_" }; exit 1 }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-x86_64-pc-windows-msvc
          path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7
