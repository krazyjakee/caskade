name: build bundles
# The release's build legs (#110): Caskade for Linux (deb, AppImage), Windows
# (NSIS) and macOS on Apple silicon and Intel (app, dmg, updater tarball),
# with the native app inside, uploaded as workflow artifacts named
# `bundles-<target>`. Called by `release` (from a tag, then signed and
# published as a draft) and by `bundles` (any commit, artifacts only).
# Read-only, and no signing secrets reach it: build scripts, proc-macros and
# npm packages run here.
on:
  workflow_call:
    inputs:
      ref:
        description: The commit or tag to build
        required: true
        type: string
      version:
        description: The version macOS's updater tarballs are named with
        required: true
        type: string
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    # Read-only, and no signing secrets in any step: everything this job runs
    # comes from dependencies.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 for an old enough glibc: the AppImage runs on the glibc it
          # was built against and newer.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # WebKitGTK 4.1 and GTK for Tauri, librsvg for the AppImage's GTK
      # plugin, AppIndicator for the tray icon (the CLI finds it through
      # pkg-config), libudev for gilrs, D-Bus for the keyring.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config file patchelf \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev libasound2-dev libudev-dev libdbus-1-dev

      - name: Rust toolchain
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          # Pinned: Rust 1.100's new Clippy lints fail the build until #136.
          rustup toolchain install 1.99.1 --profile minimal --target "$TARGET"
          rustup default 1.99.1
          rustc -Vv

      # Compiled dependencies, per target. GitHub scopes a cache to the ref
      # that saved it, and a tag's run reads its own and master's: this
      # speeds up re-runs of a tag (Re-run failed jobs, or a moved tag),
      # including after a failure. Only this repo's tag and master runs can
      # write those scopes; pull requests' caches stay in their own.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true

      # pnpm's version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # The committed config leaves createUpdaterArtifacts off, so local and
      # CI builds need no key. A file rather than inline JSON, so no
      # shell on any runner has to keep the quotes. With it on, the bundler
      # also makes macOS's updater bundle (Caskade.app.tar.gz); --no-sign
      # below leaves the signatures to the sign job.
      - name: Turn on updater artifacts
        shell: bash
        run: echo '{"bundle":{"createUpdaterArtifacts":true}}' > apps/desktop/updater-artifacts.conf.json

      # The native UI is the default. The caskade entry point starts the
      # caskade-native beside it; --legacy runs the retained Tauri UI.
      # The same installers and signed updates carry both executables.
      - name: Build the native app
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          # The MSVC runtime linked in, as the Tauri CLI links it into
          # caskade.exe: a fresh Windows has no VCRUNTIME140.dll.
          case "$TARGET" in *-windows-msvc) export RUSTFLAGS="${RUSTFLAGS:-} -C target-feature=+crt-static" ;; esac
          cargo build --release --locked -p caskade-native --target "$TARGET"
          python scripts/native-sidecar.py --target "$TARGET" --profile release

      # Builds through beforeBuildCommand (the 7-Zip sidecar for the target,
      # then the UI). No key here: --no-sign skips the updater signatures.
      - name: Build
        working-directory: apps/desktop
        run: pnpm tauri build --target ${{ matrix.target }} --config updater-artifacts.conf.json --config native-app.conf.json --no-sign -- --locked

      # The files the release carries, under their release names. Tauri calls
      # macOS's updater bundle Caskade.app.tar.gz on both architectures, so it
      # gets the version and architecture the dmg has.
      - name: Collect the bundles
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ inputs.version }}
        run: |
          shopt -s nullglob
          bundle="target/$TARGET/release/bundle"
          out="$RUNNER_TEMP/bundles"
          mkdir -p "$out"
          case "$TARGET" in
            *-linux-*) files=("$bundle"/deb/*.deb "$bundle"/appimage/*.AppImage) want=2 ;;
            *-windows-*) files=("$bundle"/nsis/*-setup.exe) want=1 ;;
            *-apple-darwin)
              files=("$bundle"/dmg/*.dmg) want=2
              arch=${TARGET%%-*}
              [ "$arch" = x86_64 ] && arch=x64
              for tarball in "$bundle"/macos/*.app.tar.gz; do
                cp "$tarball" "$out/$(basename "$tarball" .app.tar.gz)_${VERSION}_${arch}.app.tar.gz"
              done
              ;;
          esac
          [ ${#files[@]} -gt 0 ] && cp "${files[@]}" "$out/"
          ls -l "$out"
          found=$(( $(ls "$out" | wc -l) ))
          if [ "$found" -ne "$want" ]; then
            echo "::error title=Missing bundles::Expected $want release files for $TARGET under $bundle, found $found."
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundles-${{ matrix.target }}
          path: ${{ runner.temp }}/bundles
          if-no-files-found: error
          retention-days: 7
