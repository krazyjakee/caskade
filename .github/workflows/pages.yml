name: GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - apps/website/**
      - apps/native/icons/caskade.svg
      - packages/tokens/tokens.css
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - apps/website/**
      - apps/native/icons/caskade.svg
      - packages/tokens/tokens.css
      - .github/workflows/pages.yml
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'release' && 'master' || github.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check download asset selection
        run: node --test apps/website/downloads.test.mjs
      - name: Read current download assets
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/krazyjakee/caskade/releases/latest > "$RUNNER_TEMP/caskade-release.json"
      - name: Build both languages
        env:
          RELEASE_METADATA: ${{ github.event_name == 'pull_request' && 'apps/website/releases.json' || format('{0}/caskade-release.json', runner.temp) }}
        run: node apps/website/build.mjs "$RELEASE_METADATA"
      - name: Check generated pages and local links
        run: python3 apps/website/check.py
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: apps/website/dist

  deploy:
    if: (github.ref == 'refs/heads/master' || github.event_name == 'release') && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
