name: ci
# Every check, on GitHub-hosted runners: the desktop app (caskade-core, the
# Tauri adapter, the React UI and the crates they build on), the native UI
# (caskade-native: Linux, and a macOS build), the installer and discovery
# crates on Linux, Windows and macOS, and the translation catalogs.
# Pull requests run only the checks their changes reach (scripts/ci-scope.py,
# docs/TECH-SPEC.md); master pushes and manual runs run them all. The
# jobs need no secrets and get a read-only token, so pull requests from forks
# run too. The repository has no self-hosted runners, and no job here may ask
# for one. Labels a maintainer adds to a pull request ask for more: `run-e2e`
# the console-mode end-to-end runs (the webview's and the native UI's), `run-native` the installer's Linux native
# profile and discovery's live-machine checks. release.yml builds the bundles.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
# A pull request's new push cancels its older run. Each master commit gets a
# run of its own (public repository: hosted minutes are free), so a fix
# doesn't wait behind the previous commit's Linux native profile.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
  INSTA_UPDATE: "no"
  # Caches are saved from master only: pull requests (forks too) read
  # master's and leave the repo's cache space to it and the release builds.
  SAVE_CACHE: ${{ github.ref == 'refs/heads/master' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      frontend: ${{ steps.scope.outputs.frontend }}
      rust: ${{ steps.scope.outputs.rust }}
      catalogs: ${{ steps.scope.outputs.catalogs }}
      e2e: ${{ steps.scope.outputs.e2e }}
      native: ${{ steps.scope.outputs.native }}
      cross: ${{ steps.scope.outputs.cross }}
      installer: ${{ steps.scope.outputs.installer }}
      discovery: ${{ steps.scope.outputs.discovery }}
    steps:
      # Full history on pull requests gives a true merge-base diff, including
      # deleted and renamed paths.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          persist-credentials: false
      - name: CI scope regression checks
        run: python3 -m unittest discover -s scripts -p test_ci_scope.py
      - id: scope
        run: python3 scripts/ci-scope.py

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm's version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      # Known vulnerabilities in JS dependencies (#157).
      - name: JS dependency advisories
        run: pnpm audit --prod
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint (Biome)
        run: pnpm lint
      - name: Frontend tests (Vitest)
        run: pnpm test
      # `just i18n-check` (#220), UI half: a stale template, a PO file msgfmt
      # rejects or a translation that drops a placeholder or tag.
      - name: GNU gettext (msgfmt)
        if: needs.changes.outputs.catalogs == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext
      - name: UI translation catalogs
        if: needs.changes.outputs.catalogs == 'true'
        run: pnpm i18n:check

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The workspace's debug builds outgrow the runner's free disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      # Tauri's Linux libraries; the tray needs libayatana-appindicator3,
      # gamepads libudev, the catalogs msgfmt.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config file \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev libudev-dev libdbus-1-dev gettext
      # wasm32-wasip2 builds the plugin host's test guests and the examples.
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt --target wasm32-wasip2
          rustup default stable
          rustc -Vv
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: app-linux
          save-if: ${{ env.SAVE_CACHE }}
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-audit
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      # Known vulnerabilities in Rust dependencies (#157).
      - name: Rust dependency advisories
        run: cargo audit
      - name: Format app crates
        run: cargo fmt -p caskade-core -p caskade-achievements -p caskade-addons -p caskade-backup -p caskade-share -p caskade-streaming -p caskade-system-stats -p caskade-app -p caskade-ui-data -p caskade-ui-input -p caskade-ui-i18n -p caskade-ui-theme -p caskade-player -p caskade-desktop -p caskade-native -p caskade-plugin-host -p caskade-input --check
      # The native app's stylesheet (#90): Tailwind over apps/native/src.
      - name: Native app stylesheet
        run: node apps/native/scripts/build-css.mjs --check
      # The anatomy generator (#90, #93): the webview's catalogue as data
      # writes its contract; caskade-native's tests check anatomy.md.
      - name: Native anatomy generator
        run: cargo test -p caskade-ui-theme --locked anatomy
      # `just i18n-check` (#220), Rust half.
      - name: Rust translation catalogs
        if: needs.changes.outputs.catalogs == 'true'
        run: cargo run -q -p caskade-i18n --features extract --bin caskade-i18n --locked -- extract --check
      - name: Prepare SHA-pinned 7-Zip sidecar
        run: python3 scripts/tauri-sidecar.py
      - name: Strict Clippy (workspace)
        run: cargo clippy --workspace --all-targets --features caskade-desktop/dev-tools --locked -- -D warnings
      - name: Emulation fixtures, definitions and source tests (no real emulator or ROM data)
        run: python3 scripts/app-ci.py emulation
      - name: Example plugins (#133)
        run: node plugins/examples/build.mjs gamemode howlongtobeat playtime-stats
      # One selection unifies dependency features once rather than rebuilding
      # common crates for each package. Includes the bindings, emulation,
      # plugin guest/schema, gamepad and theme checks, and devices and sync
      # (#250): two or more cores on loopback, and the relay paths through a
      # local relay (iroh's test-utils), never the internet. caskade-i18n's
      # own tests (PO parsing, lint, plural rules, the extractor) back the
      # catalog checks.
      - name: Rust app suites
        run: >-
          cargo test -p caskade-core -p caskade-achievements -p caskade-addons -p caskade-backup -p caskade-share -p caskade-streaming -p caskade-system-stats -p caskade-app -p caskade-ui-data -p caskade-ui-input -p caskade-ui-i18n -p caskade-ui-theme -p caskade-player -p caskade-desktop -p caskade-native -p caskade-input
          -p caskade-plugin-host -p caskade-theme -p caskade-component-cache
          -p caskade-jobs -p caskade-plugin-sdk -p caskade-sync -p caskade-i18n
          --features caskade-i18n/extract --locked --timings
      # The system clock stepped for real, here where nothing else is running:
      # Stop and session recovery still know the game. The same selection as
      # above, so nothing is built again.
      - name: A real clock step
        env:
          CASKADE_TEST_NATIVE: "1"
        run: >-
          cargo test -p caskade-core -p caskade-achievements -p caskade-addons -p caskade-backup -p caskade-share -p caskade-streaming -p caskade-system-stats -p caskade-app -p caskade-ui-data -p caskade-ui-input -p caskade-ui-i18n -p caskade-ui-theme -p caskade-player -p caskade-desktop -p caskade-native -p caskade-input
          -p caskade-plugin-host -p caskade-theme -p caskade-component-cache
          -p caskade-jobs -p caskade-plugin-sdk -p caskade-sync -p caskade-i18n
          --features caskade-i18n/extract --locked --tests
          clock_step:: -- --ignored --nocapture
      # The starter add-on catalogue builds reproducibly from the examples
      # above and passes the checks a published one must (#7).
      - name: Starter add-on catalogue
        run: |
          cargo run -q -p caskade-desktop --features dev-tools --bin caskade-catalogue --locked -- build scripts/addons/starter.json --out target/starter-catalogue
          cargo run -q -p caskade-desktop --features dev-tools --bin caskade-catalogue --locked -- check target/starter-catalogue/catalogue.json
      - name: Upload fixtures report and build timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-linux-${{ github.run_id }}
          path: |
            target/cargo-timings/cargo-timing.html
            target/emulation-fixtures-report.json
          if-no-files-found: ignore
          retention-days: 14

  windows-cross:
    needs: changes
    if: needs.changes.outputs.cross == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      # The C parts (bundled SQLite, ring) build with the MinGW compiler.
      - name: Windows GNU cross compiler
        timeout-minutes: 20
        run: |
          # A slow mirror trickles, which apt's own timeouts don't catch, so each
          # try has a limit too. Only the download: stopping dpkg would break it.
          packages="gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64"
          apt="sudo timeout 300 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for attempt in 1 2 3; do
            $apt update && $apt install -y --no-install-recommends --download-only $packages && break
            echo "apt try $attempt didn't finish"
            [ "$attempt" != 3 ] || exit 1
          done
          sudo apt-get install -y --no-install-recommends $packages
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy --target x86_64-pc-windows-gnu
          rustup default stable
          rustc -Vv
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: x86_64-pc-windows-gnu
          save-if: ${{ env.SAVE_CACHE }}
      - name: Prepare SHA-pinned 7-Zip sidecar
        run: python3 scripts/tauri-sidecar.py --target x86_64-pc-windows-gnu
      # caskade-native included: Clippy doesn't link, and a debug windows-gnu
      # link of it fails (iroh-relay's DLL exports), so it isn't built here.
      - name: Windows GNU cross Clippy
        run: cargo clippy -p caskade-core -p caskade-achievements -p caskade-addons -p caskade-backup -p caskade-share -p caskade-streaming -p caskade-system-stats -p caskade-app -p caskade-ui-data -p caskade-ui-input -p caskade-ui-i18n -p caskade-ui-theme -p caskade-player -p caskade-desktop -p caskade-native -p caskade-plugin-host -p caskade-input -p caskade-sync --all-targets --locked --target x86_64-pc-windows-gnu -- -D warnings

  # `caskade --launch` on real Windows (#22): the named pipe, a game of two
  # processes stopped whole, and WM_CLOSE to the real caller's hidden window.
  windows-launch:
    needs: changes
    if: needs.changes.outputs.cross == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc -Vv
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: windows-launch
          cache-on-failure: true
          save-if: ${{ env.SAVE_CACHE }}
      - name: Prepare SHA-pinned 7-Zip sidecar
        run: python scripts/tauri-sidecar.py
      # Tauri gives only the app's own binaries a manifest asking for Common
      # Controls 6, and a test binary without one dies before its first test
      # (STATUS_ENTRYPOINT_NOT_FOUND). One beside each leaves what ships alone.
      - name: Build the launch caller tests
        run: cargo test -p caskade-desktop --lib --test it --locked --no-run
      - name: Common Controls 6 for the test binaries
        run: |
          for test in target/debug/deps/caskade_desktop-*.exe target/debug/deps/it-*.exe; do
            cp apps/desktop/src-tauri/tests/windows-test.manifest "$test.manifest"
          done
      - name: Launch caller tests
        run: "cargo test -p caskade-desktop --lib --test it --locked --no-fail-fast launch_cli::"

  # The administrator step on real Windows (#21, #31): the real service, rules
  # and Program Files folder, from stand-in files, on and off. The runner is an
  # administrator with no UAC, so this proves the commands, not the prompt.
  # caskade-core has no Tauri, so its test binary needs no Common Controls
  # manifest. The same binary reads this machine's firmware names (#16) and
  # runs a real program's saves through the real Windows folders (#14).
  windows-elevation:
    needs: changes
    if: needs.changes.outputs.cross == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc -Vv
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: windows-elevation
          cache-on-failure: true
          save-if: ${{ env.SAVE_CACHE }}
      - name: Administrator step on and off
        env:
          CASKADE_TEST_NATIVE: "1"
        run: "cargo test -p caskade-streaming --test it --locked windows_elevation:: -- --ignored --nocapture"
      - name: A real clock step
        env:
          CASKADE_TEST_NATIVE: "1"
        run: "cargo test -p caskade-core --test it --locked clock_step:: -- --ignored --nocapture"
      - name: Device detection from the real registry
        run: "cargo test -p caskade-core --test it --locked device_defaults::windows_ -- --nocapture"
      # A real program's saves in the real %APPDATA% and Documents, to a
      # Proton-shaped prefix and back (#14). Not required until it has passed
      # here: the first run has only been through Wine.
      - name: Saves in the real Windows folders
        run: "cargo test -p caskade-core --test it --locked windows_saves:: -- --ignored --nocapture"

  # The M5 exit (#153): the built app in console mode, driven by a pad only,
  # under Xvfb. The `e2e` feature embeds the built UI.
  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: System libraries, Xvfb and D-Bus
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config file \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev libudev-dev libdbus-1-dev \
            xvfb xauth dbus x11-utils
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustc -Vv
      # Reads the rust job's cache; its own build differs only in features.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: app-linux
          save-if: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare SHA-pinned 7-Zip sidecar
        run: python3 scripts/tauri-sidecar.py
      - name: Build the UI
        run: pnpm --filter @caskade/desktop build
      - name: Clippy with the e2e feature
        run: cargo clippy -p caskade-desktop --features e2e --all-targets --locked -- -D warnings
      # Each test starts its own Xvfb and session bus (caskade-test-desktop,
      # #122): no wrapper needed, and none of a developer's desktop reached.
      - name: Console mode end to end (pad only)
        run: >-
          cargo test -p caskade-desktop --features e2e --locked --test it console_e2e:: -- --ignored

  # The native UI (Blitz, #95) beyond the headless tests the rust job runs:
  # its window under Xvfb and its screenshots, on every change that reaches
  # caskade-native (docs/native-testing.md).
  native:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: System libraries, Xvfb and D-Bus
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config file \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev libudev-dev libdbus-1-dev \
            xvfb xauth dbus x11-utils
          # winit (the native app's window) loads these at run time, and
          # Blitz's renderer needs a wgpu adapter: Mesa's lavapipe, without a GPU.
          sudo apt-get install -y --no-install-recommends libxkbcommon-x11-0 libxcursor1 libxi6 libxrandr2 mesa-vulkan-drivers
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc -Vv
      # Reads the rust job's cache, which tests caskade-native too.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: app-linux
          save-if: false
      # The native app (#87): its window restored, a web game and a video in
      # their own wry windows, a clean quit. No window manager, so windows
      # go exactly where they ask. Then a scripted pad drives it through the
      # e2e harness (#92). Each test starts its own Xvfb and session bus.
      - name: Native app smoke test and end to end
        run: cargo test -p caskade-native --locked --test smoke --test console_e2e -- --ignored
      # Every theme on the reference screens, rendered with vello_cpu,
      # against the committed images (#90); cut titles and placeholders
      # against Chromium's rendering (#80).
      - name: Native screenshots
        run: cargo test -p caskade-native --features shots --locked --test shots --test text_pixels
      - name: Upload screenshots that differ
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-shots-${{ github.run_id }}
          path: target/tmp/shots-failed/
          if-no-files-found: ignore
          retention-days: 14

  # The native app builds on macOS (#95). A check only: its window on a
  # real Mac is a hardware check (#120).
  native-macos:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc -Vv
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: native-macos
          save-if: ${{ env.SAVE_CACHE }}
      - name: Check the native app
        run: cargo check -p caskade-native --all-targets --locked

  # The installer suite (crates/caskade-installer/docs/ci.md).
  installer:
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
            python: python3
          - runner: windows-latest
            os: windows
            python: python
          - runner: macos-latest
            os: macos
            python: python3
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      # Committed fixtures and snapshots are compared byte for byte.
      - name: Check out without line-ending conversion
        if: matrix.os == 'windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc -Vv
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-nextest@0.9.114
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: installer
          cache-on-failure: true
          save-if: ${{ env.SAVE_CACHE }}
      - name: Formatting (installer only)
        run: cargo fmt -p caskade-installer -- --check
      - name: Build with every feature
        run: cargo build -p caskade-installer --all-features --locked
      - name: Strict Clippy with every feature
        run: cargo clippy -p caskade-installer --all-targets --all-features --locked -- -D warnings
      - name: T1-T6 and T9 fixture pass/fail
        # Includes native_windows::t9_mini_installers_pass_and_malformed_inputs_fail_through_the_cli:
        # six real Inno/NSIS/MSI successes, six malformed-input rejections, clean roots.
        run: cargo nextest run -p caskade-installer --all-features --locked --profile ci
      - name: Preserve the complete-suite report before the feature-contract run
        if: always()
        run: ${{ matrix.python }} -c "from pathlib import Path; import shutil; p=Path('target/nextest/ci/junit.xml'); p.exists() and shutil.copyfile(p,p.with_name('suite-junit.xml'))"
      - name: Public documentation examples
        run: cargo test -p caskade-installer --all-features --locked --doc
      - name: Standalone CLI feature contract
        run: cargo nextest run -p caskade-installer --no-default-features --features cli --locked --profile ci --test cli
      - name: Read-only fixture staleness and size gates
        run: cargo xtask fixtures check
      - name: Fixture check contract regressions
        run: cargo test -p xtask --locked
      - name: Build genuine macOS-native fixture artifact
        if: matrix.os == 'macos'
        run: |
          python3 xtask/macos-fixtures.py --artifact target/macos-fixture-artifact
          echo "CASKADE_MACOS_FIXTURES=$PWD/target/macos-fixture-artifact" >> "$GITHUB_ENV"
      # Hosted Windows runners have a second volume, D:, which the C:→D:
      # relocation tests need; TEMP stays on C:.
      - name: Second volume for the C to D move tests
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          if (-not (Test-Path 'D:\')) { throw 'this runner has no D: volume for the C:->D: move tests' }
          $temp = [System.IO.Path]::GetTempPath()
          if (-not $temp.ToUpper().StartsWith('C:')) { throw "TEMP must be on C:, got $temp" }
          New-Item -ItemType Directory -Force 'D:\CaskadeTests' | Out-Null
          "CASKADE_TEST_MOVE_ROOT=D:\CaskadeTests" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Get-Volume | Format-Table -AutoSize
      - name: Provision the SHA-verified official 7-Zip sidecar
        if: matrix.os != 'linux'
        run: |
          ${{ matrix.python }} scripts/7zz-download.py > sidecar.json
          ${{ matrix.python }} -c "import json,os; d=json.load(open('sidecar.json')); f=open(os.environ['GITHUB_ENV'],'a'); f.write('CASKADE_7ZZ='+d['program']+'\n'); f.close()"
      # Linux's native profile needs privileged Docker, Proton and a second
      # filesystem: the installer-linux-native job runs it.
      # Windows Installer writes a verbose log of every run to TEMP (MSI*.LOG).
      - name: Windows Installer logging for the native profile
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $policy = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
          New-Item -Force $policy | Out-Null
          Set-ItemProperty $policy -Name Logging -Value 'voicewarmupx'
      - name: T7 native Windows and macOS
        if: matrix.os != 'linux'
        env:
          CASKADE_TEST_NATIVE: "1"
        run: cargo nextest run -p caskade-installer --all-features --locked --profile native --run-ignored all
      - name: Windows Installer logs of a failed native run
        if: failure() && matrix.os == 'windows'
        shell: pwsh
        run: |
          Get-ChildItem $env:TEMP -Filter 'MSI*.LOG' | Sort-Object LastWriteTime | Select-Object -Last 3 | ForEach-Object {
            "===== $($_.FullName)"
            Get-Content $_.FullName -Tail 80
          }
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.os }}-${{ github.run_id }}
          path: |
            target/nextest/**/*junit.xml
            target/native-windows/*.json
            sidecar.json
          retention-days: 14
          if-no-files-found: ignore

  # The installer's serial Linux native profile: Proton install, launch and
  # own uninstaller, the Debian/Fedora delegates in the runner's Docker, the
  # Flatpak sandbox and the second-filesystem moves. Master pushes and manual
  # runs; pull requests only with the `run-native` label.
  installer-linux-native:
    needs: changes
    if: >-
      needs.changes.outputs.installer == 'true' &&
      (github.event_name != 'pull_request' ||
       contains(github.event.pull_request.labels.*.name, 'run-native'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CASKADE_TEST_NATIVE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Room for Proton, the Steam Runtime and the build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h / /mnt
      - name: Flatpak, D-Bus, Xvfb and the Vulkan/GL loaders Proton needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            flatpak dbus xvfb xauth libvulkan1 libgl1 libegl1 libgl1-mesa-dri time util-linux
          # Ubuntu's AppArmor refuses unprivileged user namespaces, which
          # Steam Runtime's bwrap (pressure-vessel) and Flatpak need.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          docker info --format '{{.ServerVersion}}'
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc -Vv
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-nextest@0.9.114
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: installer-native
          cache-on-failure: true
          save-if: ${{ env.SAVE_CACHE }}
      # The #62 moves need a second filesystem with room for a 4 GiB Proton
      # prefix: the runner's separate /mnt disk, else a private tmpfs.
      - name: Second filesystem for the move tests
        run: |
          if [ "$(findmnt -no SOURCE --target /mnt)" != "$(findmnt -no SOURCE --target "$GITHUB_WORKSPACE")" ]; then
            sudo install -d -o "$(id -u)" -g "$(id -g)" /mnt/caskade-move
          else
            sudo install -d /mnt/caskade-move
            sudo mount -t tmpfs -o rw,exec,nosuid,nodev,size=8g tmpfs /mnt/caskade-move
            sudo chown "$(id -u):$(id -g)" /mnt/caskade-move
          fi
          findmnt --target /mnt/caskade-move
          echo "CASKADE_TEST_MOVE_ROOT=/mnt/caskade-move" >> "$GITHUB_ENV"
      - name: Provision the SHA-verified official 7-Zip sidecar
        run: |
          python3 scripts/7zz-download.py > sidecar.json
          python3 -c "import json,os; d=json.load(open('sidecar.json')); f=open(os.environ['GITHUB_ENV'],'a'); f.write('CASKADE_7ZZ='+d['program']+'\n'); f.close()"
      # The umu, Steam Runtime and UMU-Proton downloads, cached from master.
      # A miss (a changed warm-proton.py, or GitHub's eviction of caches unused
      # for 7 days) warms it again from the same pinned umu.
      - name: Restore the umu, Steam Runtime and UMU-Proton cache
        id: proton
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/caskade-cache/native/share
          key: installer-proton-${{ hashFiles('xtask/runner/warm-proton.py') }}
      - name: Warm the Proton cache after a miss
        if: steps.proton.outputs.cache-hit != 'true'
        run: xvfb-run -a python3 xtask/runner/warm-proton.py --cache ~/caskade-cache
      - name: Save the warmed Proton cache
        if: steps.proton.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/caskade-cache/native/share
          key: installer-proton-${{ hashFiles('xtask/runner/warm-proton.py') }}
      # Outside target/, which rust-cache saves: it drops a tree's files there
      # but keeps its links, and those would come back in the next job.
      - name: Copy the cached tools into a private XDG tree
        run: python3 xtask/runner/prepare-proton.py --cache ~/caskade-cache --destination "$RUNNER_TEMP/native-home/share" --evidence target/native-cache.json
      - name: Native Proton install, launch, registry self-check and own-uninstaller proof
        run: python3 xtask/runner/native-profile.py --proton
      - name: Native serial profile, including Debian, Fedora and Flatpak delegates
        if: ${{ !cancelled() }}
        run: python3 xtask/runner/native-profile.py
      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-linux-native-${{ github.run_id }}
          path: |
            sidecar.json
            target/native-cache.json
            target/proton-junit.xml
            target/native-junit.xml
            crates/caskade-installer/tests/fixtures/src/linux-mini/STEAM-DECK.md
          retention-days: 14
          if-no-files-found: ignore

  # caskade-discovery (crates/caskade-discovery/docs/ci.md).
  discovery:
    needs: changes
    if: needs.changes.outputs.discovery == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
          - runner: windows-latest
            os: windows
          - runner: macos-latest
            os: macos
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # scripts/discovery-ci.py reads Cargo.toml with tomllib (3.11+).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # The Linux leg also lints the Windows GNU and Apple targets; bundled
      # SQLite builds for Windows with the MinGW compiler.
      - name: Windows GNU cross compiler
        if: matrix.os == 'linux'
        timeout-minutes: 20
        run: |
          # A slow mirror trickles, which apt's own timeouts don't catch, so each
          # try has a limit too. Only the download: stopping dpkg would break it.
          packages="gcc-mingw-w64-x86-64"
          apt="sudo timeout 300 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for attempt in 1 2 3; do
            $apt update && $apt install -y --no-install-recommends --download-only $packages && break
            echo "apt try $attempt didn't finish"
            [ "$attempt" != 3 ] || exit 1
          done
          sudo apt-get install -y --no-install-recommends $packages
      - name: Rust toolchain
        env:
          TARGETS: ${{ matrix.os == 'linux' && '--target x86_64-pc-windows-gnu --target x86_64-apple-darwin' || '' }}
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt $TARGETS
          rustup default stable
          rustc -Vv
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: discovery-${{ matrix.os }}
          save-if: ${{ env.SAVE_CACHE }}
      # The version .config/nextest.toml is written for.
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-nextest@0.9.114
      - name: Format discovery only
        run: python scripts/discovery-ci.py fmt
      - name: Build all discovery features
        run: python scripts/discovery-ci.py build
      - name: Strict Clippy on the native target
        run: python scripts/discovery-ci.py clippy
      - name: Fixture and parser suite with JUnit
        run: python scripts/discovery-ci.py test
      - name: Public documentation examples
        run: python scripts/discovery-ci.py doc
      - name: Build every feature in isolation
        run: python scripts/discovery-ci.py features
      - name: Read-only discovery fixture privacy, hashes and size budget
        run: python scripts/discovery-ci.py fixtures
      - name: Windows GNU and Apple cross-target Clippy
        if: matrix.os == 'linux'
        run: python scripts/discovery-ci.py cross
      - name: Upload discovery test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: discovery-${{ matrix.os }}-${{ github.run_id }}
          path: target/nextest/discovery-ci/junit.xml
          if-no-files-found: ignore
          retention-days: 14

  # The ignored live checks read the runner's own launchers and stores, so
  # they run only on pull requests with the `run-native` label.
  discovery-live:
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'run-native')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
          - runner: windows-latest
            os: windows
          - runner: macos-latest
            os: macos
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CASKADE_DISCOVERY_LIVE: "1"
      CASKADE_TEST_NATIVE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc -Vv
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: discovery-${{ matrix.os }}
          save-if: false
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-nextest@0.9.114
      - name: Run only ignored live checks
        run: python scripts/discovery-ci.py live
      - name: Upload live invariants report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: discovery-live-${{ matrix.os }}-${{ github.run_id }}
          path: target/nextest/discovery-live/junit.xml
          if-no-files-found: ignore
          retention-days: 14

  # The one required check: every job the scope selected passed, nothing it
  # skipped was needed (an unaffected pull request passes here too), and no
  # label-requested job failed.
  result:
    name: ci result
    needs:
      - changes
      - frontend
      - rust
      - windows-cross
      - windows-launch
      - windows-elevation
      - e2e
      - native
      - native-macos
      - installer
      - installer-linux-native
      - discovery
      - discovery-live
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All selected checks passed
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          needs = json.loads(os.environ['NEEDS'])
          assert needs['changes']['result'] == 'success', 'scope selection failed'
          scope = needs['changes']['outputs']
          selected = {'frontend': 'frontend', 'rust': 'rust', 'windows-cross': 'cross',
                      'windows-launch': 'cross', 'windows-elevation': 'cross', 'e2e': 'e2e',
                      'native': 'native', 'native-macos': 'native',
                      'installer': 'installer', 'discovery': 'discovery'}
          failed = []
          for job, output in selected.items():
              assert scope.get(output) in ('true', 'false'), f'scope output {output} is missing'
              expected = 'success' if scope[output] == 'true' else 'skipped'
              result = needs[job]['result']
              print(f'{job}: selected={scope[output]} result={result}')
              if result != expected:
                  failed.append(job)
          for job in ('installer-linux-native', 'discovery-live'):
              result = needs[job]['result']
              print(f'{job}: result={result}')
              if result not in ('success', 'skipped'):
                  failed.append(job)
          assert not failed, 'checks did not pass: ' + ', '.join(failed)
          PYTHON
