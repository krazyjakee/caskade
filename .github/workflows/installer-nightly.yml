name: installer-nightly
# Nightly robustness, performance and scoreboard runs on GitHub-hosted Linux
# runners, from master only (no pull request trigger).
on:
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: installer-nightly
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
jobs:
  targets:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.discover.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: discover
        name: Discover every registered robustness target
        run: |
          python3 - <<'PYTHON'
          import json, os, tomllib
          from pathlib import Path
          manifest = tomllib.loads(Path('crates/caskade-installer/fuzz/Cargo.toml').read_text())
          targets = sorted(item['name'] for item in manifest['bin'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('targets=' + json.dumps(targets) + '\n')
          PYTHON
  fuzz:
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        target: ${{ fromJson(needs.targets.outputs.targets) }}
    env:
      CORPUS: crates/caskade-installer/fuzz/corpus/${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Nightly Rust and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          rustc +nightly -Vv
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-fuzz
      # The corpus each target kept last night: input bytes only, bounded by
      # fuzz-corpus.py on the way in and out. run.py adds the committed seeds.
      - name: Restore the retained corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/retained-corpus
          key: installer-fuzz-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: installer-fuzz-${{ matrix.target }}-
      - name: Seed the job-local corpus from the retained one
        run: python3 xtask/runner/fuzz-corpus.py target/retained-corpus "$CORPUS"
      - name: T8 ten-minute bounded robustness run
        run: python3 crates/caskade-installer/fuzz/run.py ${{ matrix.target }} --seconds 600
      - name: Bound the corpus for the next run
        if: ${{ !cancelled() }}
        run: |
          rm -rf target/retained-corpus
          python3 xtask/runner/fuzz-corpus.py "$CORPUS" target/retained-corpus
      - name: Retain the corpus
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/retained-corpus
          key: installer-fuzz-${{ matrix.target }}-${{ github.run_id }}
      - name: Upload reports, corpus and run evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-fuzz-${{ matrix.target }}-${{ github.run_id }}
          path: |
            crates/caskade-installer/fuzz/logs/**
            crates/caskade-installer/fuzz/artifacts/**
            ${{ env.CORPUS }}
          retention-days: 14
          if-no-files-found: ignore
  performance:
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CASKADE_PERF_OUTPUT: ${{ github.workspace }}/target/performance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # T10 writes its 20 GiB sparse probe and 10 GiB extraction under /tmp.
      - name: Room for the T10 workloads
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /tmp
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc -Vv
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: installer-performance
      - name: Provision the SHA-verified official reference extractor
        run: |
          python3 scripts/7zz-download.py > sidecar.json
          python3 -c "import json,os; d=json.load(open('sidecar.json')); f=open(os.environ['GITHUB_ENV'],'a'); f.write('CASKADE_7ZZ='+d['program']+'\n'); f.close()"
      - name: T10 strict release gates, including 20-GiB probe and 10-GiB RSS
        run: cargo test -p caskade-installer --all-features --locked --release --test performance -- --ignored --nocapture --test-threads=1
      - name: Criterion timing distributions for the same generated workloads
        if: ${{ !cancelled() }}
        run: cargo bench -p caskade-installer --all-features --locked --bench installer -- --noplot
      - name: Upload performance measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-performance-${{ github.run_id }}
          path: |
            target/performance/**
            target/criterion/**
            sidecar.json
          retention-days: 30
          if-no-files-found: ignore
  scoreboard:
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CASKADE_TEST_NATIVE: "1"
      INSTA_UPDATE: "no"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Room for Proton, the Steam Runtime and the build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h / /mnt
      - name: Flatpak, D-Bus, Xvfb and the Vulkan/GL loaders Proton needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            flatpak dbus xvfb xauth libvulkan1 libgl1 libegl1 libgl1-mesa-dri time util-linux
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc -Vv
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-nextest@0.9.114
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: installer-native
          save-if: false
      - name: Second filesystem for the move tests
        run: |
          if [ "$(findmnt -no SOURCE --target /mnt)" != "$(findmnt -no SOURCE --target "$GITHUB_WORKSPACE")" ]; then
            sudo install -d -o "$(id -u)" -g "$(id -g)" /mnt/caskade-move
          else
            sudo install -d /mnt/caskade-move
            sudo mount -t tmpfs -o rw,exec,nosuid,nodev,size=8g tmpfs /mnt/caskade-move
            sudo chown "$(id -u):$(id -g)" /mnt/caskade-move
          fi
          echo "CASKADE_TEST_MOVE_ROOT=/mnt/caskade-move" >> "$GITHUB_ENV"
      - name: Provision the SHA-verified official sidecar
        run: |
          python3 scripts/7zz-download.py > sidecar.json
          python3 -c "import json,os; d=json.load(open('sidecar.json')); f=open(os.environ['GITHUB_ENV'],'a'); f.write('CASKADE_7ZZ='+d['program']+'\n'); f.close()"
      - name: Restore the umu, Steam Runtime and UMU-Proton cache
        id: proton
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/caskade-cache/native/share
          key: installer-proton-${{ hashFiles('xtask/runner/warm-proton.py') }}
      - name: Warm the Proton cache after a miss
        if: steps.proton.outputs.cache-hit != 'true'
        run: xvfb-run -a python3 xtask/runner/warm-proton.py --cache ~/caskade-cache
      - name: Copy the cached tools into a private XDG tree
        run: python3 xtask/runner/prepare-proton.py --cache ~/caskade-cache --destination "$GITHUB_WORKSPACE/target/native-home/share" --evidence target/native-cache.json
      - name: T7 Proton install, launch, registry self-check and own-uninstaller proof
        run: python3 xtask/runner/native-profile.py --proton
      - name: T7 and T9 complete serial native corpus, including isolated delegates
        if: ${{ !cancelled() }}
        run: python3 xtask/runner/native-profile.py
      - name: T9 measured per-mini scoreboard
        if: ${{ !cancelled() }}
        run: |
          cargo build -p caskade-installer --all-features --locked --bin caskade-install
          python3 xtask/scoreboard/run.py --binary target/debug/caskade-install --seven-zip "$CASKADE_7ZZ" --native-junit target/native-junit.xml --output target/scoreboard
      - name: Upload scoreboard and native evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-scoreboard-${{ github.run_id }}
          path: |
            target/scoreboard/**
            target/native-cache.json
            target/proton-junit.xml
            target/native-junit.xml
            sidecar.json
          retention-days: 30
          if-no-files-found: ignore
