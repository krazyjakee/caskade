name: i18n
# The translation checks (`just i18n-check`, #220) for pull requests opened
# on GitHub. The repo there is a public release mirror (docs/RELEASING.md),
# so outside translators are likeliest to send their PO files there, and
# Gitea's CI (.gitea/workflows/app.yml runs the same checks) never sees
# them. Only these checks run here: no build, no secrets, a read-only token.
# Pushes to master run it too, which keeps a cache in master's scope: the
# only one a pull request (from a fork too) can read.
on:
  pull_request:
    paths: &catalog-paths
      - "locales/**"
      - "packages/i18n/**"
      - "crates/caskade-i18n/**"
  push:
    branches: [master]
    paths: *catalog-paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: i18n-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: GNU gettext (msgfmt)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # Saved from master only: pull requests read it and leave the repo's
      # 10 GB of caches to the release builds.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # pnpm's version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # Fails on a stale template, a PO file msgfmt rejects or a translation
      # that drops a placeholder or tag; prints each language's completion.
      - name: Translation catalogs
        run: |
          cargo run -q -p caskade-i18n --features extract --bin caskade-i18n --locked -- extract --check
          pnpm i18n:check
