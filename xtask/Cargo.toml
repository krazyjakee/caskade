[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
caskade-emulation-fixtures = { path = "../crates/caskade-emulation-fixtures" }
flate2 = "=1.1.10"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
tar = "=0.4.46"
toml = "=0.8.23"
rpm = { version = "=0.30.2", default-features = false, features = ["payload", "gzip-compression"] }
zip = { version = "=9.1.3", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "=3.27.0"
