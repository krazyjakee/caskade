debug_timer = { path = "vendor/blitz/crates/debug_timer" }
dioxus-native = { path = "vendor/blitz/crates/dioxus-native" }
dioxus-native-dom = { path = "vendor/blitz/crates/dioxus-native-dom" }
stylo_taffy = { path = "vendor/blitz/crates/stylo_taffy" }

[patch."https://github.com/DioxusLabs/anyrender"]
