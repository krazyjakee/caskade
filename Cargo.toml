[workspace]
members = ["crates/*", "apps/desktop/src-tauri", "apps/native", "xtask"]
# Vendored upstream crates keep their own lints and tests (see their PATCHES.md).
exclude = ["vendor"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.94"

# Dev builds keep file:line in backtraces but skip full DWARF, and dependencies
# carry none: full debug info made each test binary ~90% DWARF and dominated
# link times. For debugger sessions, override with
# CARGO_PROFILE_DEV_DEBUG=full (dependencies stay without).
# Release builds drop debuginfo but keep symbol names, so a panic's
# backtrace in a user's log still names functions (#126).
[profile.release]
strip = "debuginfo"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Account PIN hashing (#202) takes seconds unoptimized; tests hash many.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# Library pages sorted by title compare every title through ICU (#218).
[profile.dev.package.icu_collator]
opt-level = 3

# Installs decompress and hash every byte of a game: unoptimized, a 10 GB
# Inno install took over 20 minutes in a dev build.
[profile.dev.package.lzma-rust2]
opt-level = 3

[profile.dev.package.inno]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.sha1]
opt-level = 3

[profile.dev.package.md-5]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"

# Bounded-allocation safety patches over the pinned upstream releases (#26).
[patch.crates-io]
inno = { path = "vendor/inno-0.7.1" }
innospect = { path = "vendor/innospect-0.2.0" }
# sqlx 0.9.0 caps libsqlite3-sys below 0.38, whose bundled SQLite (< 3.54)
# has RUSTSEC-2026-0459. Upstream main allows 0.39 (launchbadge/sqlx#4502);
# drop these for the first release after 0.9.0 that does.
sqlx = { git = "https://github.com/launchbadge/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
sqlx-core = { git = "https://github.com/launchbadge/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
sqlx-macros = { git = "https://github.com/launchbadge/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
sqlx-macros-core = { git = "https://github.com/launchbadge/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
sqlx-mysql = { git = "https://github.com/launchbadge/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
sqlx-postgres = { git = "https://github.com/launchbadge/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
sqlx-sqlite = { git = "https://github.com/launchbadge/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
# rustls on ring only: aws-lc's C build script cost ~36 s of every cold build.
# Published crates with one-line feature/import changes (see their PATCHES.md).
hudsucker = { path = "vendor/hudsucker-0.25.0" }
librqbit-sha1-wrapper = { path = "vendor/librqbit-sha1-wrapper-9.0.1" }

# Blitz, anyrender, Stylo and Taffy with Caskade's patches (vendor/blitz/README.md):
