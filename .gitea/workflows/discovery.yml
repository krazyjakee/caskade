name: discovery
# Gitea loads this base-branch definition before any trusted PR-head checkout.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      live:
        description: Run ignored live-machine checks on the dedicated runners
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: discovery-${{ github.event.pull_request.number || github.ref }}
  # Forgejo 14+ honors this; ci-scope also skips queued obsolete PR heads on 12.
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}
jobs:
  changes:
    if: >-
      github.event_name != 'pull_request_target' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.repo.fork == false)
    runs-on: caskade-linux
    outputs:
      discovery: ${{ steps.scope.outputs.discovery }}
    steps:
      - uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: ${{ github.event_name == 'pull_request_target' && '0' || '1' }}
          persist-credentials: false
      - id: scope
        run: python3 scripts/ci-scope.py
  check:
    needs: changes
    if: >-
      needs.changes.outputs.discovery == 'true' &&
      (github.event_name != 'pull_request_target' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.repo.fork == false))
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: caskade-linux
            os: linux
            python: python3
            shell: bash
          - runner: caskade-windows-x64
            os: windows
            python: python
            shell: pwsh
          - runner: caskade-macos
            os: macos
            python: python3
            shell: bash
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      CARGO_TERM_COLOR: always
      INSTA_UPDATE: 'no'
    steps:
      - uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record toolchain and test runner
        run: |
          rustc -Vv
          cargo nextest --version
          ${{ matrix.python }} --version
      - name: Format discovery only
        run: ${{ matrix.python }} scripts/discovery-ci.py fmt
      - name: Build all discovery features
        run: ${{ matrix.python }} scripts/discovery-ci.py build
      - name: Strict Clippy on the native target
        run: ${{ matrix.python }} scripts/discovery-ci.py clippy
      - name: Fixture and parser suite with JUnit
        run: ${{ matrix.python }} scripts/discovery-ci.py test
      - name: Public documentation examples
        run: ${{ matrix.python }} scripts/discovery-ci.py doc
      - name: Build every feature in isolation
        run: ${{ matrix.python }} scripts/discovery-ci.py features
      - name: Read-only discovery fixture privacy, hashes and size budget
        run: ${{ matrix.python }} scripts/discovery-ci.py fixtures
      - name: Windows GNU and Apple cross-target Clippy
        if: matrix.os == 'linux'
        run: ${{ matrix.python }} scripts/discovery-ci.py cross
      - name: Upload discovery test results
        if: always()
        uses: https://github.com/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: discovery-${{ matrix.os }}-${{ github.run_id }}
          path: target/nextest/discovery-ci/junit.xml
          retention-days: 14
  result:
    name: discovery result
    needs: [changes, check]
    if: >-
      always() && (github.event_name != 'pull_request_target' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.repo.fork == false))
    runs-on: caskade-linux
    steps:
      - name: All selected discovery checks passed
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          SELECTED: ${{ needs.changes.outputs.discovery }}
        run: |
          python3 - <<'PYTHON'
          import os
          assert os.environ['SCOPE_RESULT'] == 'success', 'scope selection failed'
          assert os.environ['SELECTED'] in ('true', 'false'), 'scope output is missing'
          expected = 'success' if os.environ['SELECTED'] == 'true' else 'skipped'
          assert os.environ['CHECK_RESULT'] == expected, 'discovery checks did not pass'
          PYTHON
  live:
    # Opt in explicitly; labels never override the fork prohibition.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.live == 'true') ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.repo.fork == false &&
       contains(github.event.pull_request.labels.*.name, 'run-native'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: caskade-linux-native
            os: linux
            python: python3
            shell: bash
          - runner: caskade-windows-x64
            os: windows
            python: python
            shell: pwsh
          - runner: caskade-macos
            os: macos
            python: python3
            shell: bash
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      CASKADE_DISCOVERY_LIVE: '1'
      CASKADE_TEST_NATIVE: '1'
      INSTA_UPDATE: 'no'
    steps:
      - uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run only ignored live checks under the heavy lane
        run: ${{ matrix.python }} scripts/discovery-ci.py live
      - name: Upload live invariants report
        if: always()
        uses: https://github.com/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: discovery-live-${{ matrix.os }}-${{ github.run_id }}
          path: target/nextest/discovery-live/junit.xml
          retention-days: 14
