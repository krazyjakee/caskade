name: discovery-nightly
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: discovery-nightly
  cancel-in-progress: false
jobs:
  targets:
    if: github.repository == 'krazyjakee/caskade' && github.ref == 'refs/heads/master'
    runs-on: caskade-linux
    outputs:
      targets: ${{ steps.discover.outputs.targets }}
    steps:
      - uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: master
          persist-credentials: false
      - id: discover
        name: Discover every registered discovery robustness target
        run: |
          python3 - <<'PYTHON'
          import os, subprocess
          targets = subprocess.check_output(['python3', 'crates/caskade-discovery/fuzz/run.py', '--list-targets'], text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('targets=' + targets + '\n')
          PYTHON
  fuzz:
    if: github.repository == 'krazyjakee/caskade' && github.ref == 'refs/heads/master'
    needs: targets
    runs-on: caskade-linux-native
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: ${{ fromJson(needs.targets.outputs.targets) }}
    container:
      image: caskade/installer-ci:1.93.0
      volumes:
        - /srv/caskade-cache:/caskade-cache:ro
        # Trusted master only; mutation bytes never become an executable cache.
        - /srv/caskade-fuzz-corpora:/caskade-corpus:rw
    steps:
      - uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: master
          persist-credentials: false
      - name: Seed bounded discovery-only corpus
        run: |
          python3 xtask/runner/fuzz-corpus.py /caskade-cache/discovery-fuzz/${{ matrix.target }} crates/caskade-discovery/fuzz/corpus/${{ matrix.target }}
          python3 xtask/runner/fuzz-corpus.py /caskade-corpus/discovery/${{ matrix.target }} crates/caskade-discovery/fuzz/corpus/${{ matrix.target }}
      - name: Ten-minute bounded parser robustness run
        run: python3 crates/caskade-discovery/fuzz/run.py ${{ matrix.target }} --seconds 600
      - name: Retain bounded mutations for the next run
        if: always()
        run: python3 xtask/runner/fuzz-corpus.py crates/caskade-discovery/fuzz/corpus/${{ matrix.target }} /caskade-corpus/discovery/${{ matrix.target }}
      - name: Upload compact measured evidence for the deferred seven-day audit
        if: always()
        uses: https://github.com/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: discovery-evidence-${{ matrix.target }}-${{ github.run_id }}
          path: crates/caskade-discovery/fuzz/logs/**/result.json
          retention-days: 30
      - name: Upload reports, corpus and run evidence
        if: always()
        uses: https://github.com/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: discovery-fuzz-${{ matrix.target }}-${{ github.run_id }}
          path: |
            crates/caskade-discovery/fuzz/logs/**
            crates/caskade-discovery/fuzz/artifacts/**
            crates/caskade-discovery/fuzz/corpus/${{ matrix.target }}
          retention-days: 14
  performance:
    if: github.repository == 'krazyjakee/caskade' && github.ref == 'refs/heads/master'
    runs-on: caskade-linux-native
    timeout-minutes: 30
    container:
      image: caskade/installer-ci:1.93.0
      volumes:
        - /srv/caskade-cache:/caskade-cache:ro
    env:
      CARGO_TARGET_DIR: target
      CASKADE_DISCOVERY_PERF_OUTPUT: ${{ github.workspace }}/target/discovery-performance
    steps:
      - uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: master
          persist-credentials: false
      - name: Verify generated fixture provenance and privacy
        run: flock /tmp/caskade-heavy.lock cargo xtask discovery check
      - name: Strict release budget for 1000 games in ten Steam libraries and every launcher
        run: flock /tmp/caskade-heavy.lock cargo test -p caskade-discovery --all-features --locked --release --test performance -- --ignored --nocapture --test-threads=1
      - name: Upload aggregate synthetic performance measurements
        if: always()
        uses: https://github.com/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: discovery-performance-${{ github.run_id }}
          path: target/discovery-performance/**
          retention-days: 30
