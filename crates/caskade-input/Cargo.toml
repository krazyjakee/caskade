[package]
name = "caskade-input"
version = "0.1.0"
description = "Gamepad input for console mode: gilrs pads normalized to UI actions (no Tauri dependency)"
edition.workspace = true
rust-version.workspace = true

# `gilrs` reads real pads (libudev on Linux). Without it the service only
# carries injected input, which tests and hosts without pad support use.
[features]
default = ["gilrs"]
gilrs = ["dep:gilrs"]

[dependencies]
serde = { version = "1", features = ["derive"] }
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
tracing = "0.1"

[target.'cfg(not(windows))'.dependencies]
gilrs = { version = "0.11", optional = true }

# Windows Gaming Input, gilrs' default there, sends nothing to a process whose
# focus is in another's window, and WebView2's is in msedgewebview2.
[target.'cfg(windows)'.dependencies]
caskade-xinput = { path = "../caskade-xinput" }
gilrs = { version = "0.11", optional = true, default-features = false, features = ["xinput"] }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
