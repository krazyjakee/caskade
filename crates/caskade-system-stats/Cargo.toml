[package]
name = "caskade-system-stats"
version = "0.1.0"
description = "Caskade's live system statistics for Settings → Statistics (#156)"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
caskade-core = { path = "../caskade-core", default-features = false }
serde = { version = "1", features = ["derive"] }
specta = { version = "=2.0.0-rc.26", features = ["derive", "serde_json"] }
# Same pin as caskade-core: disks and networks.
sysinfo = { version = "=0.38.4", default-features = false, features = ["system", "disk", "network"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "process", "fs", "io-util"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "=3.27.0"
