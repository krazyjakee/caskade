[package]
name = "caskade-app"
version = "0.1.0"
description = "Caskade's application layer: state, permissions, events and recovery, shared by every app shell and free of Tauri"
edition.workspace = true
rust-version.workspace = true

[dependencies]
caskade-core = { path = "../caskade-core" }
caskade-backup = { path = "../caskade-backup" }
caskade-achievements = { path = "../caskade-achievements" }
caskade-share = { path = "../caskade-share" }
# The storage scanner the storage commands rescan with.
caskade-sources = { path = "../caskade-sources" }
# A share link as a QR code (`commands::shares`).
qrcode = { version = "=0.14.1", default-features = false, features = ["svg"] }
# Installed-games discovery and its controller (`discovery/`).
caskade-discovery = { path = "../caskade-discovery" }
# The add-on catalogue and packages.
caskade-addons = { path = "../caskade-addons" }
# Game streaming: the managed host and client, and pairing.
caskade-streaming = { path = "../caskade-streaming" }
# Plugins, their UI and the themes they bundle.
caskade-plugin-host = { path = "../caskade-plugin-host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
tracing = "0.1"
url = "2"

# Offers Caskade for magnet links and torrent files (`torrent_links.rs`).
[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
