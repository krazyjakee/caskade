[package]
name = "caskade-app"
version = "0.1.0"
description = "Caskade's application layer: state, permissions, events and recovery, shared by every app shell and free of Tauri"
edition.workspace = true
rust-version.workspace = true

[dependencies]
caskade-core = { path = "../caskade-core" }
caskade-backup = { path = "../caskade-backup" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
tracing = "0.1"
url = "2"

# Offers Caskade for magnet links and torrent files (`torrent_links.rs`).
[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
