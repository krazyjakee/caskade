[package]
name = "caskade-plugin-sdk"
version = "0.1.1"
description = "Rust SDK for Caskade plugin backends: caskade:plugin@0.1.1 bindings, a Plugin trait with JSON helpers, and export!"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
wit-bindgen = { version = "0.63", default-features = false, features = ["macros", "realloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Not the workspace lints: wit-bindgen's generated exports need `unsafe`,
# which the workspace forbids. Plugin code built on this needs none.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
