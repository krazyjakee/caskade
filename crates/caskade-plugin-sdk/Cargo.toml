[package]
name = "caskade-plugin-sdk"
version = "0.2.0"
description = "Rust SDK for Caskade plugin backends: caskade:plugin@0.2.0 bindings, a Plugin trait with JSON helpers, UI trees, translations, and export!"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
wit-bindgen = { version = "0.63", default-features = false, features = ["macros", "realloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The UI trees a plugin draws (#109).
caskade-plugin-ui = { path = "../caskade-plugin-ui" }

# Not the workspace lints: wit-bindgen's generated exports need `unsafe`,
# which the workspace forbids. Plugin code built on this needs none.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
