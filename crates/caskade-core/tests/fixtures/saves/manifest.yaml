Steam Fixture:
  steam: {id: 620}
  files:
    <winDocuments>/Fixture/*.sav:
      tags: [save]
      when: [{os: windows, store: steam}]
    <winAppData>/Fixture:
      tags: [save, config]
      when: [{os: windows}]
    <xdgData>/Fixture/*.sav:
      tags: [save]
      when: [{os: linux}]
  registry:
    HKEY_CURRENT_USER/Software/Fixture:
      tags: [save]
    HKEY_LOCAL_MACHINE/Software/Fixture:
      tags: [config]
