[package]
name = "caskade-discovery-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
caskade-discovery = { path = "..", default-features = false, features = ["sqlite"] }
tempfile = "=3.27.0"

[workspace]
members = ["."]

