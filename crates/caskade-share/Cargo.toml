[package]
name = "caskade-share"
version = "0.1.0"
description = "Caskade's one-off shares (#246, #249): a game or a smaller item shared once through a link that can be stopped"
edition.workspace = true
rust-version.workspace = true
publish = false

# Integration tests are declared below, not discovered from tests/.
autotests = false

[dependencies]
caskade-core = { path = "../caskade-core", features = ["net"] }
caskade-sync = { path = "../caskade-sync" }
caskade-installer = { path = "../caskade-installer", default-features = false }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.26", features = ["derive", "serde_json"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "process", "fs", "io-util"] }
tokio-util = "0.7"
tracing = "0.1"

[dev-dependencies]
# `test_programs`, for core's tests/networks.rs that the tests include.
caskade-core = { path = "../caskade-core", features = ["net", "test-utils"] }
# A local relay for the relay-path test (tests/shares.rs).
caskade-sync = { path = "../caskade-sync", features = ["test-utils"] }
caskade-discovery = { path = "../caskade-discovery", default-features = false }
tempfile = "=3.27.0"
wiremock = "0.6"

[lints]
workspace = true

# One binary for the integration tests (tests/main.rs), as in caskade-core.
[[test]]
name = "it"
path = "tests/main.rs"
