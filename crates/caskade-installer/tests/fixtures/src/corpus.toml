schema_version = 1

[layouts.unity]
platform = "windows"
launch_target = "FixtureGame.exe"
binaries = ["FixtureGame.exe", "UnityCrashHandler64.exe"]
empty_directories = ["FixtureGame_Data"]

[layouts.unreal]
platform = "windows"
launch_target = "FixtureGame.exe"
binaries = ["FixtureGame.exe", "FixtureGame/Binaries/Win64/FixtureGame-Win64-Shipping.exe"]
empty_directories = ["Engine/Binaries/Win64"]

[layouts.gog]
platform = "windows"
launch_target = "FixtureGame.exe"
binaries = ["FixtureGame.exe", "__redist/vcredist_x64.exe", "__redist/DirectX/DXSETUP.exe"]

[layouts.linux]
platform = "linux"
launch_target = "start.sh"
binaries = ["FixtureGame.x86_64"]
executable_files = ["start.sh"]

[layouts.macos]
platform = "macos"
launch_target = "FixtureGame.app/Contents/MacOS/FixtureGame"
executable_files = ["FixtureGame.app/Contents/MacOS/FixtureGame"]

[[layouts.macos.symlinks]]
path = "FixtureGame.app/Contents/Frameworks/X.framework/Versions/Current"
target = "A"
[[layouts.macos.symlinks]]
path = "FixtureGame.app/Contents/Frameworks/X.framework/X"
target = "Versions/Current/X"
[[layouts.macos.symlinks]]
path = "FixtureGame.app/Contents/Frameworks/X.framework/Resources"
target = "Versions/Current/Resources"

