schema_version = 1
id = "gog-inno-sliced"
title = "Fixture Game"
layout = "gog"
format = "inno"
platform = "windows"
input = "bin/windows/gog-inno-sliced/setup.exe"
parts = ["bin/windows/gog-inno-sliced/setup.exe", "bin/windows/gog-inno-sliced/setup-1.bin", "bin/windows/gog-inno-sliced/setup-2.bin", "bin/windows/gog-inno-sliced/setup-3.bin", "bin/windows/gog-inno-sliced/setup-4.bin"]
tree = "windows/gog-inno-sliced.tree.json"
launch_target = "FixtureGame.exe"

[windows]
builder = "ISCC"
version = "6.4.3"
features = ["SLICED"]
native_generated = []

[host.windows]
outcome = "Installed"
strategy = "RunSilent"
runtime = "Native"

[host.linux]
outcome = "Installed"
strategy = "Extract"
runtime = "ProtonPrefix"

[host.macos]
outcome = "Installed"
strategy = "Extract"
runtime = "WinePrefix"
