schema_version = 1
id = "inno5-registry"
title = "Fixture Game"
layout = "unity"
format = "inno"
platform = "windows"
input = "bin/windows/inno5-registry/setup.exe"
parts = ["bin/windows/inno5-registry/setup.exe"]
tree = "windows/inno5-registry.tree.json"
launch_target = "FixtureGame.exe"

[windows]
builder = "ISCC"
version = "5.6.1"
features = ["REGISTRY"]
native_generated = []

[host.windows]
outcome = "Installed"
strategy = "RunSilent"
runtime = "Native"

[host.linux]
outcome = "Installed"
strategy = "Extract"
runtime = "ProtonPrefix"

[host.macos]
outcome = "Installed"
strategy = "Extract"
runtime = "WinePrefix"
