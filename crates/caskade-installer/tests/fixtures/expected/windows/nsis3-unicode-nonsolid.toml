schema_version = 1
id = "nsis3-unicode-nonsolid"
title = "Fixture Game"
layout = "unity"
format = "nsis"
platform = "windows"
input = "bin/windows/nsis3-unicode-nonsolid/setup.exe"
parts = ["bin/windows/nsis3-unicode-nonsolid/setup.exe"]
tree = "windows/nsis3-unicode-nonsolid.tree.json"
launch_target = "FixtureGame.exe"

[windows]
builder = "makensis"
version = "3.11"
features = ["unicode", "nonsolid-zlib", "shortcut", "ini"]
native_generated = ["config.ini:Game/InstallPath={app}"]

[host.windows]
outcome = "Installed"
strategy = "RunSilent"
runtime = "Native"

[host.linux]
outcome = "Installed"
strategy = "Extract"
runtime = "ProtonPrefix"

[host.macos]
outcome = "Installed"
strategy = "Extract"
runtime = "WinePrefix"
