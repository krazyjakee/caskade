layout = "gog"
format = "zip"
platform = "windows"
input = "bin/gog.zip"
parts = ["bin/gog.zip"]
tree = "gog-zip.tree.json"
launch_target = "FixtureGame.exe"

[host.linux]
outcome = "Installed"
