schema_version = 1
id = "native-nsis-uninstall"
title = "Caskade Native NSIS Fixture"
layout = "unity"
format = "nsis"
platform = "windows"
input = "bin/native-uninstall/native-nsis-uninstall/setup.exe"
parts = ["bin/native-uninstall/native-nsis-uninstall/setup.exe"]
tree = "native-uninstall/native-nsis-uninstall.tree.json"
launch_target = "FixtureGame.exe"

[windows]
builder = "makensis"
version = "3.11"
features = ["native-uninstall", "registry", "ini"]
native_generated = ["config.ini", "Uninstall.exe"]

[host.windows]
outcome = "Installed"
strategy = "RunSilent"
runtime = "Native"

[host.linux]
outcome = "Installed"
strategy = "Extract"
runtime = "ProtonPrefix"

[host.macos]
outcome = "Installed"
strategy = "Extract"
runtime = "WinePrefix"
