format = "cue"
platform = "sony_playstation"
input = "bin/disc/ps1-cue-bin.cue"
parts = ["bin/disc/ps1-cue-bin.cue", "bin/disc/ps1-cue-bin.bin"]
tree = "disc/ps1-cue-bin.tree.json"
launch_target = "CASKADE.EXE"
[host.windows]
