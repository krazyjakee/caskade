# Redistributables shipped with Windows games (INSTALLER-PLAN §4.6).
# files: lower-case glob on the file name (`*` = any run, `?` = one char).
# product_names: case-insensitive prefixes of the PE/MSI ProductName.
# silent: argv for an unattended, no-prompt install.
# installed: Windows registry value that exists once the runtime is present.
# winetricks: protonfixes/winetricks verbs used instead inside a prefix.

[[redist]]
id = "vcredist-2015-2022-x64"
name = "Microsoft Visual C++ 2015-2022 Redistributable (x64)"
files = ["vcredist_x64.exe", "vc_redist.x64.exe", "vcredist_2015*_x64.exe", "vcredist_2017*_x64.exe", "vcredist_2019*_x64.exe", "vc_redist_2022*_x64.exe"]
product_names = ["Microsoft Visual C++ 2015", "Microsoft Visual C++ 2017", "Microsoft Visual C++ 2019", "Microsoft Visual C++ 2022"]
silent = ["/install", "/quiet", "/norestart"]
installed = { hive = "HKLM", key = 'SOFTWARE\Microsoft\VisualStudio\14.0\VC\Runtimes\x64', value = "Installed" }
winetricks = ["vcrun2022"]

[[redist]]
id = "vcredist-2015-2022-x86"
name = "Microsoft Visual C++ 2015-2022 Redistributable (x86)"
files = ["vcredist_x86.exe", "vc_redist.x86.exe", "vcredist_2015*_x86.exe", "vcredist_2017*_x86.exe", "vcredist_2019*_x86.exe", "vc_redist_2022*_x86.exe"]
silent = ["/install", "/quiet", "/norestart"]
installed = { hive = "HKLM", key = 'SOFTWARE\WOW6432Node\Microsoft\VisualStudio\14.0\VC\Runtimes\x86', value = "Installed" }
winetricks = ["vcrun2022"]

