[[redist]]
id = "directx-jun2010"
name = "DirectX End-User Runtime (June 2010)"
files = ["dxsetup.exe"]
product_names = ["DirectX"]
silent = ["/silent"]
# The legacy D3DX DLLs are not tracked by a registry value; probe the file.
installed = { file = 'System32\d3dx9_43.dll' }
winetricks = ["d3dx9", "d3dx10", "d3dx11_43", "d3dcompiler_43", "xact"]

