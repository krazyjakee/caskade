[package]
name = "caskade-ui-input"
version = "0.1.0"
description = "The native UI's input rules, free of any UI toolkit: spatial focus over layout boxes, the keyboard map, command bindings, the action dispatcher and the on-screen keyboard's model"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# The actions pads send (`Action`); no pad backend.
caskade-input = { path = "../caskade-input", default-features = false }

