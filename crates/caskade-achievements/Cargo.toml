[package]
name = "caskade-achievements"
version = "0.1.0"
description = "Caskade's achievements and notification feed, over caskade-core"
edition.workspace = true
rust-version.workspace = true

# `net` reads achievements from the services (Steam, GOG, Epic,
# RetroAchievements); without it, only what is cached.
[features]
default = ["net"]
net = ["caskade-core/net", "dep:flate2", "dep:reqwest", "dep:caskade-jobs"]

[dependencies]
caskade-core = { path = "../caskade-core", default-features = false }
caskade-discovery = { path = "../caskade-discovery", default-features = false }
caskade-jobs = { path = "../caskade-jobs", optional = true }
async-trait = "0.1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"], optional = true }
md5 = { package = "md-5", version = "0.10" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"], optional = true }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.26", features = ["derive", "serde_json"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "fs"] }
tokio-util = "0.7"
tracing = "0.1"
url = "2"

[dev-dependencies]
caskade-installer = { path = "../caskade-installer", default-features = false }
tempfile = "=3.27.0"
wiremock = "0.6"

[lints]
workspace = true
