[package]
name = "caskade-plugin-ui"
version = "0.2.0"
description = "The UI plugins draw (#109): a small tree of Caskade's components as JSON, shared by the plugin host, the Rust plugin SDK and the native app"
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
# `specta::Type` for the webview's bindings; off in plugins' wasm builds.
specta = ["dep:specta"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.26", features = ["derive", "serde_json"], optional = true }

[lints]
workspace = true
