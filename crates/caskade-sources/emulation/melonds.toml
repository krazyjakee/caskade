id = "melonds"
name = "melonDS"
website = "http://melonds.kuribo64.net/"
tracking = { type = "default" }

[detect.windows]
executable = "(?i)^melonDS\\.exe$"
locations = ["{ProgramFiles}/melonDS", "{AppData}/melonDS", "{UserHome}/AppData/Local/melonDS", "{UserHome}/scoop/apps/melonds/current", "C:/ProgramData/chocolatey/lib/melonds/tools"]

[detect.linux]
executable = "^(?:melonDS|melonds)$"
path = ["melonDS", "melonds"]
flatpak = "net.kuribo64.melonDS"
appimage = "(?i)^melonDS(?:[-_].*)?\\.AppImage$"
locations = ["{UserHome}/Applications/melonDS", "{UserHome}/Emulation/tools/melonds", "{UserHome}/Emulation/tools/launchers", "/opt/melonds"]

[detect.macos]
executable = "(?i)^(?:melonDS|melonDS)$"
bundle = "net.kuribo64.melonDS"
path = ["melonDS"]
locations = ["/Applications/melonDS.app/Contents/MacOS", "{UserHome}/Applications/melonDS.app/Contents/MacOS"]

[install.windows]
source = "github"
repo = "melonDS-emu/melonDS"
asset = '^melonDS-[\d.]+-windows-x86_64\.zip$'
[install.linux]
source = "github"
repo = "melonDS-emu/melonDS"
asset = '^melonDS-[\d.]+-appimage-x86_64\.zip$'
[install.macos]
source = "github"
repo = "melonDS-emu/melonDS"
asset = '^melonDS-[\d.]+-macOS-universal\.zip$'

[display]
fullscreen = ["--fullscreen"]

[[profile]]
name = "Default"
platforms = ["nintendo_ds"]
extensions = ["nds", "zip"]
args = ["{RomPath}"]
requires = []
