# Save defaults: https://github.com/libretro/RetroArch/blob/master/retroarch.cfg and frontend/drivers/platform_{win32,unix,darwin}.{c,m}
[saves]
files = ["{save_data}/saves/**/{RomNameNoExt}.srm", "{save_data}/saves/**/{RomNameNoExt}.rtc", "{save_data}/saves/**/{RomNameNoExt}.psrm", "{save_data}/saves/**/{RomNameNoExt}.sav"]
states = ["{save_data}/states/**/{RomNameNoExt}.state*"]

# Configuration that syncs between devices (#275): input remaps
# (`remaps/<core>/<game>.rmp`), core and game overrides (`<core>/*.cfg`), core
# options (`*.opt`) and shader presets, all in RetroArch's config_directory.
# Defaults: https://github.com/libretro/RetroArch/blob/master/retroarch.cfg
# (config_directory, input_remapping_directory) and frontend/drivers/platform_{win32,unix,darwin}.{c,m}
[config]
files = ["{config}/**"]
