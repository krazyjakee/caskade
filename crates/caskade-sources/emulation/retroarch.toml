# See ../THIRD-PARTY.md for the license and adaptation notes.


id = "retroarch"
name = "RetroArch"
website = "http://www.retroarch.com/"
tracking = { type = "default" }

[detect.windows]
executable = "(?i)^retroarch\\.exe$"
locations = ["{ProgramFiles}/RetroArch", "{AppData}/RetroArch", "{UserHome}/AppData/Local/RetroArch", "{UserHome}/scoop/apps/retroarch/current", "C:/ProgramData/chocolatey/lib/retroarch/tools"]

[detect.linux]
executable = "^(?:retroarch)$"
path = ["retroarch"]
flatpak = "org.libretro.RetroArch"
appimage = "(?i)^RetroArch(?:[-_].*)?\\.AppImage$"
locations = ["{UserHome}/Applications/RetroArch", "{UserHome}/Emulation/tools/retroarch", "{UserHome}/Emulation/tools/launchers", "/opt/retroarch"]

[detect.macos]
executable = "(?i)^(?:retroarch|RetroArch)$"
bundle = "com.libretro.RetroArch"
path = ["retroarch"]
locations = ["/Applications/RetroArch.app/Contents/MacOS", "{UserHome}/Applications/RetroArch.app/Contents/MacOS"]

# `bios` is where the emulator looks for BIOS files (#122).
[vars]
save_data = "{EmulatorDir}"
config = "{EmulatorDir}/config"
cores = "{EmulatorDir}/cores"
bios = "{EmulatorDir}/system"
lib = ".dll"
[vars.linux]
save_data = "{XdgConfig}/retroarch"
config = "{XdgConfig}/retroarch/config"
cores = "{XdgConfig}/retroarch/cores"
bios = "{XdgConfig}/retroarch/system"
lib = ".so"
[vars.linux.flatpak]
save_data = "{EmulatorDir}/config/retroarch"
config = "{EmulatorDir}/config/retroarch/config"
cores = "{UserHome}/.var/app/org.libretro.RetroArch/config/retroarch/cores"
bios = "{UserHome}/.var/app/org.libretro.RetroArch/config/retroarch/system"
[vars.macos]
save_data = "{UserHome}/Documents/RetroArch"
config = "{AppSupport}/RetroArch/config"
cores = "{AppSupport}/RetroArch/cores"
bios = "{AppSupport}/RetroArch/system"
lib = ".dylib"

# The version is RetroArch's GitHub tag; the builds are on libretro's
# buildbot. Cores install separately.
[install.windows]
source = "github"
repo = "libretro/RetroArch"
url = "https://buildbot.libretro.com/stable/{version}/windows/x86_64/RetroArch.7z"
[install.linux]
source = "github"
repo = "libretro/RetroArch"
url = "https://buildbot.libretro.com/stable/{version}/linux/x86_64/RetroArch.7z"
[install.macos]
source = "github"
repo = "libretro/RetroArch"
url = "https://buildbot.libretro.com/stable/{version}/apple/osx/universal/RetroArch_Metal.dmg"

[display]
fullscreen = ["--fullscreen"]

# Cores (the profiles' `requires`) come from libretro's nightly buildbot.
[requires_from]
windows = "https://buildbot.libretro.com/nightly/windows/x86_64/latest/{file}.zip"
linux = "https://buildbot.libretro.com/nightly/linux/x86_64/latest/{file}.zip"
macos = "https://buildbot.libretro.com/nightly/apple/osx/{arch}/latest/{file}.zip"

[[profile]]
name = "Mesen"
platforms = ["nintendo_nes"]
extensions = ["7z", "fds", "nes", "unf", "unif", "zip"]
args = ["-L", "{cores}/mesen_libretro{lib}", "{RomPath}"]
requires = ["{cores}/mesen_libretro{lib}"]

