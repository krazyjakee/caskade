id = "ryujinx"
name = "Ryujinx"
website = "https://ryujinx.org/"
tracking = { type = "process_name", name = "{process}" }

[detect.windows]
executable = "(?i)^ryujinx(?:\\.ava)?\\.exe$"
locations = ["{ProgramFiles}/Ryujinx", "{AppData}/Ryujinx", "{UserHome}/AppData/Local/Ryujinx", "{UserHome}/scoop/apps/ryujinx/current", "C:/ProgramData/chocolatey/lib/ryujinx/tools"]

[detect.linux]
executable = "^(?:Ryujinx)$"
path = ["Ryujinx"]
flatpak = "org.ryujinx.Ryujinx"
appimage = "(?i)^Ryujinx(?:[-_].*)?\\.AppImage$"
locations = ["{UserHome}/Applications/Ryujinx", "{UserHome}/Emulation/tools/ryujinx", "{UserHome}/Emulation/tools/launchers", "/opt/ryujinx"]

[detect.macos]
executable = "(?i)^(?:Ryujinx|Ryujinx)$"
bundle = "org.ryujinx.Ryujinx"
path = ["Ryujinx"]
locations = ["/Applications/Ryujinx.app/Contents/MacOS", "{UserHome}/Applications/Ryujinx.app/Contents/MacOS"]

[vars]
save_data = "{AppData}/Ryujinx"
process = "Ryujinx"
[vars.windows]
process = "Ryujinx.exe"

# No install source: Nintendo's DMCA notice of 2026-02-12 took Switch
# emulators off GitHub (EMULATOR-SETUP-PLAN §1).
[display]
fullscreen = ["--fullscreen"]

[[profile]]
name = "Default"
platforms = ["nintendo_switch"]
extensions = ["xci", "nsp"]
args = ["{RomPath}"]
requires = []

[vars.linux]
save_data = "{XdgConfig}/Ryujinx"

[vars.linux.flatpak]
save_data = "{EmulatorDir}/config/Ryujinx"

[vars.macos]
save_data = "{AppSupport}/Ryujinx"

# Save defaults: https://docs.ryujinx.app/guides/setup-guide/ and https://github.com/Ryubing/docs/blob/main/docs/info/faq-%26-troubleshooting.md (retained upstream guide: application data, user/system saves)
[saves]
files = ["{save_data}/bis/user/save", "{save_data}/bis/system/save"]
states = []
