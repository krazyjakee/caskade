# Authored for Caskade from docs/research/emulator-sources.md (sources and
# flags checked 2026-10-28).

id = "flycast"
name = "Flycast"
website = "https://github.com/flyinghead/flycast"
tracking = { type = "default" }

[detect.windows]
executable = "(?i)^flycast\\.exe$"
locations = ["{ProgramFiles}/Flycast", "{UserHome}/AppData/Local/flycast", "{UserHome}/scoop/apps/flycast/current"]

[detect.linux]
executable = "^flycast$"
path = ["flycast"]
flatpak = "org.flycast.Flycast"
appimage = "(?i)^flycast(?:[-_].*)?\\.AppImage$"
locations = ["{UserHome}/Applications/Flycast", "{UserHome}/Emulation/tools/flycast"]

[detect.macos]
executable = "^Flycast$"
bundle = "com.flyinghead.Flycast"
locations = ["/Applications/Flycast.app/Contents/MacOS"]

[install.windows]
source = "github"
repo = "flyinghead/flycast"
asset = '^flycast-win64-[\d.]+\.zip$'
[install.linux]
source = "github"
repo = "flyinghead/flycast"
asset = '^flycast-x86_64-[\d.]+\.AppImage$'
[install.macos]
source = "github"
repo = "flyinghead/flycast"
asset = '^flycast-macOS-[\d.]+\.zip$'

# No fullscreen flag: a one-launch config override instead.
[display]
fullscreen = ["-config", "window:fullscreen=yes"]
windowed = ["-config", "window:fullscreen=no"]

[[profile]]
name = "Dreamcast"
platforms = ["sega_dreamcast"]
extensions = ["cdi", "gdi", "chd", "cue", "m3u"]
args = ["{RomPath}"]

[vars]
save_data = "{EmulatorDir}/data"

[vars.linux]
save_data = "{UserHome}/.local/share/flycast"

[vars.linux.flatpak]
save_data = "{EmulatorDir}/data/flycast"

[vars.macos]
save_data = "{AppSupport}/Flycast/data"

# Save defaults: https://github.com/flyinghead/flycast/blob/7adbf3caef251b153e348df3f469a0f35878339d/core/windows/winmain.cpp and core/linux-dist/main.cpp; shell/apple/emulator-osx/emulator-osx/osx-main.mm; core/oslib/oslib.cpp; core/hw/maple/maple_devs.cpp
[saves]
files = ["{save_data}/vmu_save_*.bin", "{save_data}/*_vmu_save_*.bin"]
states = ["{save_data}/{RomNameNoExt}.state*", "{save_data}/{RomNameNoExt}_[0-9]*.state*"]
