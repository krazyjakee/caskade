# flags checked 2026-10-28).

id = "shadps4"
name = "shadPS4"
website = "https://shadps4.net/"
tracking = { type = "default" }

[detect.windows]
executable = "(?i)^shadps4\\.exe$"
locations = ["{ProgramFiles}/shadPS4"]

[detect.linux]
executable = "^shadps4$"
flatpak = "net.shadps4.shadPS4"
appimage = "(?i)^shadps4(?:[-_].*)?\\.AppImage$"

[detect.macos]
executable = "^shadps4$"
locations = ["/Applications/shadps4.app/Contents/MacOS"]

# The SDL builds: the Qt launcher has prereleases only.
[install.windows]
source = "github"
repo = "shadps4-emu/shadPS4"
asset = '^shadps4-win64-sdl-.*\.zip$'
[install.linux]
source = "github"
repo = "shadps4-emu/shadPS4"
asset = '^shadps4-linux-sdl-.*\.zip$'
[install.macos]
source = "github"
repo = "shadps4-emu/shadPS4"
asset = '^shadps4-macos-sdl-.*\.zip$'

[display]
fullscreen = ["--fullscreen", "true"]
windowed = ["--fullscreen", "false"]

[[profile]]
name = "PlayStation 4"
platforms = ["sony_playstation4"]
extensions = ["bin"]
args = ["-g", "{RomPath}"]

[vars]
save_data = "{AppData}/shadPS4"

[vars.linux]
save_data = "{UserHome}/.local/share/shadPS4"

[vars.macos]
save_data = "{AppSupport}/shadPS4"

# Save defaults: https://github.com/shadps4-emu/shadPS4/blob/2183807e592b36d4440384878165b43d930c1dee/src/common/path_util.cpp and src/core/libraries/save_data/save_instance.cpp
[saves]
files = ["{save_data}/home/*/savedata"]
states = []
