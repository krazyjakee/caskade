[package]
name = "caskade-theme"
version = "0.1.0"
description = "Caskade theme packages: theme.json, DTCG tokens and theme.css, linted against the theming contract and compiled into one cs.theme stylesheet"
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
cli = []

[[bin]]
name = "caskade-theme"
required-features = ["cli"]

[dependencies]
cssparser = "0.38"
# PO catalogs for the theme's name and description (#219).
caskade-i18n = { path = "../caskade-i18n" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
