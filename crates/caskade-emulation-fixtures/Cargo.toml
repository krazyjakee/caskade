[package]
name = "caskade-emulation-fixtures"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Generated synthetic emulation fixtures; development and CI only"
# Integration tests are declared below, not discovered from tests/.
autotests = false

[dependencies]
serde = { version = "1", features = ["derive"] }
tempfile = "=3.27.0"
backhand = { version = "=0.25.5", default-features = false, features = ["gzip"] }
sevenz-rust2 = { version = "=0.20.2", default-features = false, features = ["compress"] }
zip = { version = "=9.1.3", default-features = false, features = ["deflate"] }

[dev-dependencies]
caskade-discovery = { path = "../caskade-discovery", default-features = false, features = ["linux-sources", "deep"] }

[lints]
workspace = true

# One binary for the integration tests (tests/main.rs); see its header.
[[test]]
name = "it"
path = "tests/main.rs"
