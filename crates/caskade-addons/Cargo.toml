[package]
name = "caskade-addons"
version = "0.1.0"
description = "Caskade's add-on catalogue (#181): the signed catalogue, add-on packages and the author tools"
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["net"]
# Fetching the catalogue and add-on downloads, with caskade-core's `net`.
net = ["caskade-core/net", "dep:reqwest"]

[dependencies]
caskade-core = { path = "../caskade-core", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.26", features = ["derive", "serde_json"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "process", "fs", "io-util"] }
tokio-util = "0.7"
tracing = "0.1"
url = "2"
sha2 = "0.10"
semver = { version = "1", features = ["serde"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "ico"] }
zip = { version = "=9.1.3", default-features = false, features = ["deflate"] }
# The catalogue's signature (minisign, the updater's key and the same crate
# the updater uses).
minisign-verify = "=0.3.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"], optional = true }

[dev-dependencies]
tempfile = "=3.27.0"
wiremock = "0.6"
# Signs two versions of a catalogue with a throwaway key; the adapter's pin.
minisign = "=0.10.0"

[lints]
workspace = true
