[package]
name = "caskade-desktop"
version = "0.1.4"
description = "Caskade desktop app: the Tauri adapter over caskade-app and caskade-core"
edition.workspace = true
rust-version.workspace = true
default-run = "caskade"
# Integration tests are declared below, not discovered from tests/.
autotests = false

[features]
# The end-to-end harness's scripted pad driver (#153, `src/e2e.rs`). It
# embeds the built frontend (`pnpm build` first).
e2e = ["tauri/custom-protocol"]
# The developer and CI tools below (#126): `just bindings` and the add-on
# catalogue's maintainer tool. Off in release builds, so the bundles carry
# only `caskade` (Tauri's bundler packs every binary it builds).
dev-tools = []

[lib]
name = "caskade_desktop"
# Desktop binaries and integration tests consume this as Rust. The mobile
# template's static/shared libraries add an archive and link we never use.
crate-type = ["rlib"]

[[bin]]
name = "caskade"
path = "src/main.rs"

# Writes the TypeScript bindings (`just bindings`).
[[bin]]
name = "export-bindings"
path = "src/bin/export_bindings.rs"
required-features = ["dev-tools"]

# Builds and checks the add-on catalogue (`docs/plugins/publishing.md`).
[[bin]]
name = "caskade-catalogue"
path = "src/bin/catalogue.rs"
required-features = ["dev-tools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
caskade-core = { path = "../../../crates/caskade-core" }
# The application layer this adapter forwards to (#86).
caskade-app = { path = "../../../crates/caskade-app" }
# The game and video windows (`--web-game`, `--video`), shared with the
# native app.
caskade-player = { path = "../../../crates/caskade-player" }
caskade-achievements = { path = "../../../crates/caskade-achievements" }
caskade-addons = { path = "../../../crates/caskade-addons" }
caskade-backup = { path = "../../../crates/caskade-backup" }
caskade-share = { path = "../../../crates/caskade-share" }
# Game streaming and its administrator step (#254).
caskade-streaming = { path = "../../../crates/caskade-streaming" }
caskade-system-stats = { path = "../../../crates/caskade-system-stats" }
caskade-sources = { path = "../../../crates/caskade-sources" }
caskade-discovery = { path = "../../../crates/caskade-discovery" }
caskade-plugin-host = { path = "../../../crates/caskade-plugin-host" }
# Gamepads for console mode (#146).
caskade-input = { path = "../../../crates/caskade-input" }
# WebView2's process failures, for `webview_recovery.rs` (#3); empty
# outside Windows.
caskade-webview2 = { path = "../../../crates/caskade-webview2" }
# Caps glibc's malloc arenas before any thread starts (`main.rs`); empty
# outside Linux.
caskade-malloc = { path = "../../../crates/caskade-malloc" }
# The tray icon (`tray.rs`).
tauri = { version = "2.12", features = ["tray-icon"] }
# Forwards a second launch's deep link to the running app (#57).
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
# Caskade's own updates (`commands/app_update.rs`).
tauri-plugin-updater = "2"
time = { version = "0.3", features = ["formatting"] }
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "=0.0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "net", "fs", "io-util", "time", "macros"] }
# The `--launch` caller's hidden window on Windows (`launch_cli.rs`): the tao Tauri
# already builds, with the same features.
tao = { version = "0.37", default-features = false, features = ["rwh_06", "x11"] }
url = "2"

# Reads WebKitGTK's rendering policy (`webkit.rs`) and watches its web
# process (`webview_recovery.rs`); wry already builds it.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2", features = ["v2_34"] }
# Present the main window to bring it back from minimized (`main_window.rs`).
gtk = "0.18"
gdkx11 = "0.18"
# Probes for the AppIndicator library the tray icon loads (`tray.rs`).
libappindicator-sys = "0.9"

[dev-dependencies]
caskade-emulation-fixtures = { path = "../../../crates/caskade-emulation-fixtures" }
tauri = { version = "2.12", features = ["test"] }
tempfile = "=3.27.0"
# The e2e's own display and session bus (#122).
caskade-test-desktop = { path = "../../../crates/caskade-test-desktop" }
wiremock = "0.6"
# Catalogue package fixtures (#182); the core's pin.
zip = { version = "=9.1.3", default-features = false, features = ["deflate"] }
sha2 = "0.10"
# Signs the smoke test's catalogues with a throwaway key (#184).
minisign = "=0.10.0"

[lints]
workspace = true

# One binary for the integration tests (tests/main.rs); see its header.
[[test]]
name = "it"
path = "tests/main.rs"
