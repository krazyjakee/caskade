<!doctype html>
<html lang="en" data-mode="desktop" data-color-scheme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/caskade.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Caskade</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Shown while the app starts; src/onboarding/boot.ts fades it out. The
         theme's tokens aren't loaded yet, so it carries its own colours. -->
    <div id="boot" aria-hidden="true">
      <img src="/caskade.svg" alt="" />
      <span>CASKADE</span>
    </div>
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 1.25rem;
        background: radial-gradient(circle at 50% 45%, #141a3a 0%, #060914 60%);
        color: #eef0fb;
        font: 600 1.25rem/1 system-ui, sans-serif;
        letter-spacing: 0.45em;
        transition: opacity 0.45s ease-out;
      }
      #boot[data-state="done"] {
        opacity: 0;
        pointer-events: none;
      }
      #boot img {
        width: 72px;
        height: 72px;
        filter: drop-shadow(0 0 22px #6f66ff99);
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      #boot span {
        padding-left: 0.45em;
        opacity: 0.85;
      }
      @keyframes boot-pulse {
        50% {
          filter: drop-shadow(0 0 36px #6f66ffcc);
          scale: 1.04;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot,
        #boot img {
          transition: none;
          animation: none;
        }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
