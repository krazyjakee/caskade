# BLITZ-0 (#79): a throwaway Dioxus Native prototype of the library, to
# measure Blitz against today's webview UI. Its own workspace and lockfile, so
# the alpha Dioxus and beta Blitz dependencies never touch the main workspace.
[workspace]

[package]
name = "caskade-native-proto"
version = "0.0.0"
edition = "2024"
publish = false

[features]
default = ["hybrid"]
# Blitz's renderers: vello_hybrid (its default), vello (GPU compute), vello_cpu, skia.
hybrid = ["dioxus-native/vello-hybrid"]
gpu = ["dioxus-native/vello"]
cpu = ["dioxus-native/vello-cpu-softbuffer"]
skia = ["dioxus-native/skia"]
# Blitz's own per-frame timings on stdout.
log-frame-times = ["dioxus-native/log-frame-times"]
# Blitz's style, layout and paint-tree timings per resolve.
log-phase-times = ["dioxus-native/log-phase-times"]
# CASKADE_PROTO_PROFILE=<file>: sample the bench window (SIGPROF) and write
# self and inclusive time per function.
profile = ["dep:pprof"]

[dependencies]
# Blitz 0.3.0-beta.4 at the spike's commit (PR #78), with Dioxus 0.8.0-alpha.3.
dioxus-native = { git = "https://github.com/DioxusLabs/blitz", rev = "9f9c8e321735890754b4a9970cb07765b8bf3c0c", default-features = false, features = ["prelude", "accessibility", "net", "svg", "system-fonts", "woff", "html"] }
blitz-dom = { git = "https://github.com/DioxusLabs/blitz", rev = "9f9c8e321735890754b4a9970cb07765b8bf3c0c", default-features = false }
# The core without `net` (sync, stores, downloads): the prototype only reads the library.
caskade-core = { path = "../../crates/caskade-core", default-features = false }
caskade-input = { path = "../../crates/caskade-input" }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
# Covers are WebP thumbnails.
image = { version = "0.25", default-features = false, features = ["webp", "png", "jpeg"] }
parley = { version = "0.12", default-features = false, features = ["std"] }
log = "0.4"
pprof = { version = "0.15", default-features = false, optional = true }

# The main workspace's patches (root Cargo.toml), for caskade-core's dependencies.
[patch.crates-io]
inno = { path = "../../vendor/inno-0.7.1" }
innospect = { path = "../../vendor/innospect-0.2.0" }
sqlx = { git = "https://github.com/launchbadge/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
sqlx-core = { git = "https://github.com/launchbadge/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
sqlx-macros = { git = "https://github.com/launchbadge/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
sqlx-macros-core = { git = "https://github.com/launchbadge/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
sqlx-mysql = { git = "https://github.com/launchbadge/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
sqlx-postgres = { git = "https://github.com/launchbadge/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
sqlx-sqlite = { git = "https://github.com/launchbadge/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }

# Measured builds: release with line tables, in their own directory of the
# shared target (`--profile proto`).
[profile.proto]
inherits = "release"
debug = "line-tables-only"

# Blitz, anyrender and Stylo with Caskade's patches, as the root workspace
# builds them (vendor/blitz/README.md).
[patch."https://github.com/DioxusLabs/blitz"]
accesskit_xplat = { path = "../../vendor/blitz/crates/accesskit_xplat" }
blitz-dom = { path = "../../vendor/blitz/crates/blitz-dom" }
blitz-html = { path = "../../vendor/blitz/crates/blitz-html" }
blitz-net = { path = "../../vendor/blitz/crates/blitz-net" }
blitz-paint = { path = "../../vendor/blitz/crates/blitz-paint" }
blitz-shell = { path = "../../vendor/blitz/crates/blitz-shell" }
blitz-traits = { path = "../../vendor/blitz/crates/blitz-traits" }
debug_timer = { path = "../../vendor/blitz/crates/debug_timer" }
dioxus-native = { path = "../../vendor/blitz/crates/dioxus-native" }
dioxus-native-dom = { path = "../../vendor/blitz/crates/dioxus-native-dom" }
stylo_taffy = { path = "../../vendor/blitz/crates/stylo_taffy" }

[patch."https://github.com/DioxusLabs/anyrender"]
anyrender = { path = "../../vendor/blitz/crates/anyrender" }
anyrender_skia = { path = "../../vendor/blitz/crates/anyrender_skia" }
anyrender_svg = { path = "../../vendor/blitz/crates/anyrender_svg" }
anyrender_vello = { path = "../../vendor/blitz/crates/anyrender_vello" }
anyrender_vello_cpu = { path = "../../vendor/blitz/crates/anyrender_vello_cpu" }
anyrender_vello_hybrid = { path = "../../vendor/blitz/crates/anyrender_vello_hybrid" }
pixels_window_renderer = { path = "../../vendor/blitz/crates/pixels_window_renderer" }
softbuffer_window_renderer = { path = "../../vendor/blitz/crates/softbuffer_window_renderer" }
wgpu_context = { path = "../../vendor/blitz/crates/wgpu_context" }

[patch."https://github.com/servo/stylo"]
selectors = { path = "../../vendor/blitz/crates/selectors" }
servo_arc = { path = "../../vendor/blitz/crates/servo_arc" }
stylo = { path = "../../vendor/blitz/crates/stylo" }
stylo_atoms = { path = "../../vendor/blitz/crates/stylo_atoms" }
stylo_derive = { path = "../../vendor/blitz/crates/stylo_derive" }
stylo_dom = { path = "../../vendor/blitz/crates/stylo_dom" }
stylo_malloc_size_of = { path = "../../vendor/blitz/crates/stylo_malloc_size_of" }
stylo_static_prefs = { path = "../../vendor/blitz/crates/stylo_static_prefs" }
stylo_traits = { path = "../../vendor/blitz/crates/stylo_traits" }
to_shmem = { path = "../../vendor/blitz/crates/to_shmem" }
to_shmem_derive = { path = "../../vendor/blitz/crates/to_shmem_derive" }
