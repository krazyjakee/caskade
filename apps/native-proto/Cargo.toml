# BLITZ-0 (#79): a throwaway Dioxus Native prototype of the library, to
# measure Blitz against today's webview UI. Its own workspace and lockfile, so
# the alpha Dioxus and beta Blitz dependencies never touch the main workspace.
[workspace]

[package]
name = "caskade-native-proto"
version = "0.0.0"
edition = "2024"
publish = false

[features]
default = ["hybrid"]
# Blitz's renderers: vello_hybrid (its default), vello (GPU compute), vello_cpu, skia.
hybrid = ["dioxus-native/vello-hybrid"]
gpu = ["dioxus-native/vello"]
cpu = ["dioxus-native/vello-cpu-softbuffer"]
skia = ["dioxus-native/skia"]
# Blitz's own per-frame timings on stdout.
log-frame-times = ["dioxus-native/log-frame-times"]
# Blitz's style, layout and paint-tree timings per resolve.
log-phase-times = ["dioxus-native/log-phase-times"]

[dependencies]
# Blitz 0.3.0-beta.4 at the spike's commit (PR #78), with Dioxus 0.8.0-alpha.3.
dioxus-native = { git = "https://github.com/DioxusLabs/blitz", rev = "9f9c8e321735890754b4a9970cb07765b8bf3c0c", default-features = false, features = ["prelude", "accessibility", "net", "svg", "system-fonts", "woff"] }
blitz-dom = { git = "https://github.com/DioxusLabs/blitz", rev = "9f9c8e321735890754b4a9970cb07765b8bf3c0c", default-features = false }
# The core without `net` (sync, stores, downloads): the prototype only reads the library.
caskade-core = { path = "../../crates/caskade-core", default-features = false }
caskade-input = { path = "../../crates/caskade-input" }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
# Covers are WebP thumbnails.
image = { version = "0.25", default-features = false, features = ["webp", "png", "jpeg"] }
parley = { version = "0.12", default-features = false, features = ["std"] }
log = "0.4"

# The main workspace's patches (root Cargo.toml), for caskade-core's dependencies.
[patch.crates-io]
inno = { path = "../../vendor/inno-0.7.1" }
innospect = { path = "../../vendor/innospect-0.2.0" }
sqlx = { git = "https://github.com/launchbadge/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
sqlx-core = { git = "https://github.com/launchbadge/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
sqlx-macros = { git = "https://github.com/launchbadge/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
sqlx-macros-core = { git = "https://github.com/launchbadge/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
sqlx-mysql = { git = "https://github.com/launchbadge/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
sqlx-postgres = { git = "https://github.com/launchbadge/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
sqlx-sqlite = { git = "https://github.com/launchbadge/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }

# Measured builds: release with line tables, in their own directory of the
# shared target (`--profile proto`).
[profile.proto]
inherits = "release"
debug = "line-tables-only"
