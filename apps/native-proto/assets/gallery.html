<div data-cs="backdrop" aria-hidden="true"></div>
<div style="position: relative; padding: 32px; display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start; color: var(--cs-color-fg); font-family: var(--cs-font-sans)">
  <div data-cs="hero" style="position: relative; width: 560px; height: 240px; overflow: hidden; border-radius: 12px; background: var(--cs-color-surface-raised)">
    <div data-part="glow" style="position: absolute; left: 160px; top: 40px; width: 240px; height: 160px; border-radius: 50%; background: radial-gradient(closest-side, var(--cs-color-accent), transparent)"></div>
    <div data-part="fx"></div>
    <div style="position: absolute; left: 24px; bottom: 20px; font-size: 22px">Hero: scan beam and drifting glow</div>
  </div>
  <div data-cs="game-card" data-variant="library" style="position: relative; width: 180px; height: 260px; overflow: hidden; border-radius: 10px; border: 1px solid var(--cs-color-border); background: var(--cs-color-surface-raised)">
    <div data-part="art" style="position: relative; width: 180px; height: 200px; overflow: hidden; background: linear-gradient(160deg, hsl(260 55% 28%), hsl(200 60% 12%))"></div>
    <div style="padding: 8px 12px; font-size: 13px">Card: hover sweep</div>
  </div>
  <div style="display: flex; align-items: center; gap: 10px; font-size: 14px">
    <span data-part="live-dot" style="display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: var(--cs-color-accent-alt)"></span>
    Live dot: pulse
  </div>
</div>
