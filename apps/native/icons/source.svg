<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Caskade</title>
  <defs>
    <clipPath id="squircle">
      <rect x="72" y="72" width="880" height="880" rx="220"/>
    </clipPath>
    <radialGradient id="bg" cx="50%" cy="26%" r="74%" fx="50%" fy="20%">
      <stop offset="0%" stop-color="#111726"/>
      <stop offset="55%" stop-color="#0c101b"/>
      <stop offset="100%" stop-color="#090c14"/>
    </radialGradient>
    <radialGradient id="glow-cyan" cx="38%" cy="30%" r="52%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-violet" cx="62%" cy="68%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="32%" stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="cyan" x1="20%" y1="15%" x2="80%" y2="85%">
      <stop offset="0%" stop-color="#56ccf9"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="mark-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <g clip-path="url(#squircle)">
    <rect x="72" y="72" width="880" height="880" fill="url(#bg)"/>
    <rect x="72" y="72" width="880" height="880" fill="url(#glow-cyan)"/>
    <rect x="72" y="72" width="880" height="880" fill="url(#glow-violet)"/>
    <ellipse cx="512" cy="88" rx="340" ry="64" fill="#ffffff" fill-opacity="0.045"/>
  </g>
  <rect x="74" y="74" width="876" height="876" rx="218" fill="none" stroke="url(#rim)" stroke-width="4"/>
  <g filter="url(#mark-shadow)">
    <circle cx="512" cy="512" r="290" fill="none" stroke="url(#cyan)" stroke-width="76"/>
    <rect x="324" y="460" width="376" height="104" rx="10" transform="rotate(-45 512 512)" fill="url(#violet)"/>
  </g>
</svg>
