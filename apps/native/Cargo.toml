[package]
name = "caskade-native"
version = "0.1.4"
description = "Caskade's native app: the main window rendered by Blitz, over caskade-app, without Tauri"
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["hybrid"]
# Blitz's renderers (BLITZ-0 measured hybrid): vello_hybrid (its default),
# vello (GPU compute), vello_cpu and skia.
hybrid = ["dioxus-native/vello-hybrid"]
gpu = ["dioxus-native/vello"]
cpu = ["dioxus-native/vello-cpu-softbuffer"]
skia = ["dioxus-native/skia"]
# The smoke test's environment hooks (`src/smoke.rs`) in a release build,
# for a manual run on another OS; debug builds always have them.
smoke = []
# The reference screens' screenshots (`src/shots.rs`, #90): vello_cpu,
# headless. `cargo test -p caskade-native --features shots --test shots`.
# The reference screens include the component gallery's pages.
shots = ["dep:anyrender", "dep:anyrender_vello_cpu", "dep:blitz-paint", "gallery"]
# The component gallery (`src/gallery`, #93) in a release build:
# `caskade-native --gallery`; debug builds always have it.
gallery = []
# The end-to-end harness's scripted pad (`src/input/e2e.rs`) in a release
# build; debug builds always have it.
e2e = []
# The library's scroll benchmark (`src/library/bench.rs`) and fixtures mode
# in a release build, for measuring; debug builds always have them.
bench = []

[build-dependencies]
# The Windows exe's manifest and icon (`build.rs`), as Tauri's build embeds.
embed-resource = "3"

[[bin]]
name = "caskade-native"
path = "src/main.rs"

# The screenshots of every theme need the `shots` feature (#90).
[[test]]
name = "shots"
required-features = ["shots"]

[[test]]
name = "text_pixels"
required-features = ["shots"]

[dependencies]
# The BLITZ-0 baseline (#113, Pins): Blitz 9f9c8e3 with Dioxus 0.8.0-alpha.3,
# anyrender 812644a and Stylo 2dca345, as apps/native-proto pins them. They
# move together, and the BLITZ-0 measurements are rerun on every bump.
# Without `net` (blitz-net): its reqwest builds rustls on aws-lc, which the
# workspace keeps out (`web_player/proxy.rs`'s lockfile test), and the app's
# images come from the artwork cache, not the network.
dioxus-native = { git = "https://github.com/DioxusLabs/blitz", rev = "9f9c8e321735890754b4a9970cb07765b8bf3c0c", default-features = false, features = ["prelude", "accessibility", "svg", "system-fonts", "woff"] }
caskade-app = { path = "../../crates/caskade-app" }
caskade-core = { path = "../../crates/caskade-core" }
# What views read and change, and fixtures mode (#89, `src/data`).
caskade-ui-data = { path = "../../crates/caskade-ui-data" }
# Pads (`src/input`), and the webview's input rules ported to Rust (#92).
caskade-input = { path = "../../crates/caskade-input" }
caskade-ui-input = { path = "../../crates/caskade-ui-input" }
# The UI's text: the webview's catalogs, t! and formatting (#91).
caskade-ui-i18n = { path = "../../crates/caskade-ui-i18n" }
# The user's clock, for dates in the library (#94).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Appearance, the accent and the user CSS check, as the webview has them (#90).
caskade-ui-theme = { path = "../../crates/caskade-ui-theme" }
# The game and video windows (`--web-game`, `--video`), shared with the
# Tauri app.
caskade-player = { path = "../../crates/caskade-player" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tracing = "0.1"
# The window's own event loop around Dioxus Native's (`launch.rs`): the
# BLITZ-0 revision, as dioxus-native has them.
blitz-dom = { git = "https://github.com/DioxusLabs/blitz", rev = "9f9c8e321735890754b4a9970cb07765b8bf3c0c", default-features = false }
blitz-shell = { git = "https://github.com/DioxusLabs/blitz", rev = "9f9c8e321735890754b4a9970cb07765b8bf3c0c", default-features = false, features = ["data-uri"] }
blitz-traits = { git = "https://github.com/DioxusLabs/blitz", rev = "9f9c8e321735890754b4a9970cb07765b8bf3c0c", default-features = false }
# Headless rendering for the screenshots (`shots`), at the same revisions.
blitz-paint = { git = "https://github.com/DioxusLabs/blitz", rev = "9f9c8e321735890754b4a9970cb07765b8bf3c0c", default-features = false, optional = true }
anyrender = { git = "https://github.com/DioxusLabs/anyrender", branch = "main", optional = true }
anyrender_vello_cpu = { git = "https://github.com/DioxusLabs/anyrender", branch = "main", default-features = false, optional = true }
# The tray icon and its menu (`tray.rs`), as the Tauri app builds them.
tray-icon = { version = "0.25", default-features = false, features = ["libappindicator"] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The bundled fonts under the tokens' family names, and theme asset URLs
# (`theme.rs`), at the versions Blitz uses.
parley = "0.12"
url = "2"
percent-encoding = "2"

# Linux: the tray's GTK loop, and the AppIndicator library loaded at run time.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
libappindicator-sys = "0.9"

# Windows and macOS: the OS's dialogs (`dialogs.rs`), as Tauri builds them.
[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = { version = "0.16", default-features = false, features = ["common-controls-v6"] }

# Windows: whether the OS asks for less motion (`theme.rs`), as caskade-app
# reads the registry.
[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"

[dev-dependencies]
# The accessibility test reads Blitz's AccessKit tree (#83).
accesskit = "0.25"
tempfile = "=3.27.0"
# The smoke and e2e tests' own display and session bus (#122).
caskade-test-desktop = { path = "../../crates/caskade-test-desktop" }

[lints]
workspace = true
